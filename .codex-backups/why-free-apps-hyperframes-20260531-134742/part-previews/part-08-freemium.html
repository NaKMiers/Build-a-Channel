<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Part08Freemium Audio Preview</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --paper: #FFFDF7;
        --ink: #101827;
        --red: #E5162E;
        --blue: #2057D6;
        --yellow: #F2C14E;
        --teal: #8DD6DF;
        --green: #95D5B2;
        --soft: #F7F1E8;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family: "Ink Free", "Lucida Handwriting", "Segoe Print", "Comic Sans MS", cursive;
      }
      [data-composition-id] {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: var(--paper);
        background-image:
          linear-gradient(90deg, rgba(16, 24, 39, 0.03) 1px, rgba(255, 253, 247, 0) 1px),
          linear-gradient(0deg, rgba(16, 24, 39, 0.03) 1px, rgba(255, 253, 247, 0) 1px);
        background-size: 72px 72px;
      }
      .board-clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .text-block {
        position: absolute;
        font-family: "Ink Free", "Lucida Handwriting", "Segoe Print", "Comic Sans MS", cursive;
        font-weight: 800;
        white-space: pre-line;
        transform-origin: center;
      }
      .delayed-text {
        opacity: 0;
      }
      .label-card {
        position: absolute;
        border: 6px solid var(--ink);
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: "Ink Free", "Lucida Handwriting", "Segoe Print", "Comic Sans MS", cursive;
        line-height: 1;
        font-weight: 800;
        white-space: pre-line;
        box-shadow: 0 13px 0 rgba(16, 24, 39, 0.13);
        transform-origin: center;
      }
      .wit-wrap {
        position: absolute;
      }
      .wit-img {
        position: absolute;
        left: 0;
        height: auto;
        filter: drop-shadow(0 18px 22px rgba(16, 24, 39, 0.14));
      }
      .phone {
        position: absolute;
        border: 8px solid var(--ink);
        background: #ffffff;
        box-shadow: 0 22px 0 rgba(16, 24, 39, 0.14);
      }
      .phone-speaker {
        height: 18px;
        border-radius: 999px;
        background: var(--ink);
        margin: 24px auto 0;
      }
      .phone-badge {
        position: absolute;
        border: 5px solid var(--ink);
        border-radius: 24px;
        background: var(--yellow);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Ink Free", "Lucida Handwriting", "Segoe Print", "Comic Sans MS", cursive;
        font-weight: 800;
      }
      .phone-item {
        position: absolute;
        height: 48px;
        border-bottom: 4px solid var(--ink);
        font-family: "Ink Free", "Lucida Handwriting", "Segoe Print", "Comic Sans MS", cursive;
        font-weight: 800;
      }
      .phone-invoice {
        position: absolute;
        border: 5px solid var(--ink);
        border-radius: 12px;
        background: #ffffff;
        transform: rotate(4deg);
        padding: 18px;
        font-family: "Ink Free", "Lucida Handwriting", "Segoe Print", "Comic Sans MS", cursive;
        font-weight: 800;
        box-shadow: 0 14px 0 rgba(16, 24, 39, 0.12);
      }
      .phone-invoice div {
        margin-top: 18px;
        padding-top: 12px;
        border-top: 4px dashed var(--ink);
        color: var(--red);
      }
      .red-cross {
        position: absolute;
      }
      .cross-a, .cross-b {
        position: absolute;
        left: 0;
        top: calc(50% - 8px);
        width: 100%;
        height: 14px;
        border-radius: 999px;
        background: var(--red);
        transform-origin: center;
      }
      .cross-a { transform: rotate(-9deg); }
      .cross-b { transform: rotate(8deg); }
      .underline {
        position: absolute;
        height: 9px;
        border-radius: 999px;
        transform-origin: left center;
      }
      .arrow {
        position: absolute;
        height: 12px;
        border-radius: 999px;
        background: var(--ink);
        transform-origin: left center;
      }
      .arrow-head {
        position: absolute;
        right: -3px;
        top: -14px;
        width: 0;
        height: 0;
        border-top: 20px solid rgba(255, 253, 247, 0);
        border-bottom: 20px solid rgba(255, 253, 247, 0);
        border-left: 34px solid var(--ink);
      }
      .smash-text {
        position: absolute;
        font-family: "Ink Free", "Lucida Handwriting", "Segoe Print", "Comic Sans MS", cursive;
        line-height: 1;
        font-weight: 800;
        transform-origin: center;
        filter: drop-shadow(0 10px 0 rgba(16, 24, 39, 0.12));
      }
      .end-card-frame {
        position: absolute;
        inset: 74px;
        border: 8px solid var(--ink);
        border-radius: 24px;
        opacity: 0.08;
      }
    </style>
  </head>
