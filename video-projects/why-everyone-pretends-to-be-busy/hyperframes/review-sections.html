<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Why Everyone Pretends To Be Busy - Section Review</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f4efe4;
        color: #1f1b16;
        font-family: system-ui, sans-serif;
      }

      body {
        padding: 24px;
      }

      h1 {
        margin: 0 0 16px;
        font-size: 28px;
        letter-spacing: 0;
      }

      .links {
        display: flex;
        gap: 12px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }

      a {
        display: inline-flex;
        align-items: center;
        min-height: 40px;
        padding: 9px 14px;
        border: 2px solid #1f1b16;
        background: #fff9ea;
        color: #1f1b16;
        text-decoration: none;
        font-weight: 700;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
      }

      .panel {
        min-width: 0;
      }

      h2 {
        margin: 0 0 10px;
        font-size: 20px;
        letter-spacing: 0;
      }

      iframe {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        border: 4px solid #1f1b16;
        background: #fff9ea;
      }

      @media (max-width: 1200px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <h1>Section Review</h1>
    <div class="links">
      <a href="/api/projects/hyperframes/preview/comp/review/section-01.html" target="_blank">Open Section 1</a>
      <a href="/api/projects/hyperframes/preview/comp/review/section-02.html" target="_blank">Open Section 2</a>
    </div>
    <div class="grid">
      <section class="panel">
        <h2>Section 1 Hook</h2>
        <iframe src="/api/projects/hyperframes/preview/comp/review/section-01.html" title="Section 1 Hook"></iframe>
      </section>
      <section class="panel">
        <h2>Section 2 Reframe</h2>
        <iframe src="/api/projects/hyperframes/preview/comp/review/section-02.html" title="Section 2 Reframe"></iframe>
      </section>
    </div>
  </body>
</html>
