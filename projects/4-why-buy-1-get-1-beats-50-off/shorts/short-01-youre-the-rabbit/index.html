<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Short 01 - You're The Rabbit</title>
<style>
  @font-face{ font-family:'Patrick Hand'; src:url('assets/fonts/patrick-hand-latin.woff2') format('woff2'); font-display:swap; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:#07070a; overflow:hidden; }
  #Short01{ position:relative; width:1080px; height:1920px; overflow:hidden; background:#07070a;
            font-family:'Patrick Hand', system-ui, sans-serif; }

  .scene{ position:absolute; inset:0; }
  .photo{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center; }
  .scrim-top{ position:absolute; top:0; left:0; right:0; height:660px;
              background:linear-gradient(180deg, rgba(0,0,0,0.60), rgba(0,0,0,0)); }
  .scrim-bottom{ position:absolute; bottom:0; left:0; right:0; height:600px;
                 background:linear-gradient(0deg, rgba(0,0,0,0.58), rgba(0,0,0,0)); }

  /* WIT - big, face above the centered caption, body bleeds toward the bottom */
  .wit{ position:absolute; left:50%; bottom:360px; transform:translateX(-50%);
        width:980px; transform-origin:center bottom; opacity:0;
        filter:drop-shadow(0 14px 30px rgba(0,0,0,0.55)); }
  .wit-layer{ position:absolute; inset:0; pointer-events:none; }

  /* WIT-becomes-the-rabbit wrapper + CSS bunny ears (Scene D payoff) */
  .witwrap{ position:absolute; left:50%; bottom:360px; transform:translateX(-50%);
            width:980px; height:980px; opacity:0; filter:drop-shadow(0 14px 30px rgba(0,0,0,0.55)); }
  .witwrap .wit{ position:absolute; left:0; top:0; width:100%; height:auto; bottom:auto;
                 transform:none; opacity:1; filter:none; }
  .ears{ position:absolute; left:0; top:0; width:100%; height:100%; opacity:0; transform-origin:50% 70%; }
  .ear{ position:absolute; top:-3%; width:9.5%; height:23%; background:#fff; border:7px solid #241c12;
        border-radius:48% 48% 46% 46% / 62% 62% 38% 38%; box-shadow:5px 7px 0 rgba(0,0,0,0.18); }
  .ear::after{ content:""; position:absolute; left:50%; top:16%; transform:translateX(-50%);
               width:44%; height:62%; background:#f3a6c2; border-radius:50%; }
  .ear.left { left:37.5%; transform:rotate(-18deg); transform-origin:50% 100%; }
  .ear.right{ left:53%;   transform:rotate(18deg);  transform-origin:50% 100%; }

  /* Hero cards / handwritten labels - upper third */
  .card-layer{ position:absolute; inset:0; }
  .label{ position:absolute; left:50%; transform:translateX(-50%) rotate(-1.6deg);
          background:#fdf6e3; color:#241c12; font-size:74px; line-height:1.06;
          padding:18px 38px; border-radius:16px; border:4px solid #241c12;
          box-shadow:0 12px 26px rgba(0,0,0,0.45); white-space:nowrap; text-align:center; opacity:0; }
  .label.sub{ font-size:54px; background:#fff6df; transform:translateX(-50%) rotate(1.2deg); }
  .label.hot{ background:#ffe2b8; }
  .math{ position:absolute; left:50%; transform:translateX(-50%);
         background:rgba(253,246,227,0.97); color:#241c12; font-size:62px;
         padding:14px 34px; border-radius:14px; border:4px solid #241c12;
         box-shadow:0 10px 22px rgba(0,0,0,0.4); white-space:nowrap; text-align:center; opacity:0; }
  .math .num{ color:#1d7a3a; font-size:66px; }
  .math.bogo .num{ color:#c0392b; }
  .stamp{ position:absolute; left:50%; transform:translateX(-50%) rotate(-6deg);
          color:#fff; background:#c0392b; font-size:120px; letter-spacing:2px;
          padding:8px 44px; border-radius:18px; border:6px solid #fff;
          box-shadow:0 14px 30px rgba(0,0,0,0.5); opacity:0; }
  /* the MAGIC beat */
  .magic{ position:absolute; left:50%; top:250px; transform:translateX(-50%) rotate(-3deg);
          color:#fff; background:#c0392b; font-size:104px; line-height:1.0; letter-spacing:1px;
          padding:16px 46px; border-radius:18px; border:6px solid #fff; white-space:nowrap; text-align:center;
          box-shadow:0 16px 34px rgba(0,0,0,0.55); opacity:0; }
  .rabbit{ position:absolute; left:50%; top:250px; transform:translateX(-50%) rotate(-2deg);
           color:#241c12; background:#ffd23f; font-size:128px; line-height:1.0;
           padding:24px 50px; border-radius:22px; border:7px solid #241c12;
           box-shadow:0 18px 40px rgba(0,0,0,0.55); text-align:center; white-space:nowrap; opacity:0; }

  /* Captions - distinct subtitle style, vertically centered */
  .caption-layer{ position:absolute; inset:0; }
  .cap{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
        background:rgba(16,12,9,0.5); border-radius:22px; padding:14px 32px;
        color:#fff; font-size:62px; line-height:1.1; text-align:center; white-space:nowrap;
        max-width:800px; text-shadow:0 2px 0 #000, 0 0 16px rgba(0,0,0,0.85);
        -webkit-text-stroke:1px rgba(0,0,0,0.55); opacity:0; }
</style>
</head>
<body>
<div id="Short01" data-composition-id="Short01" data-start="0" data-duration="19.5" data-width="1080" data-height="1920">

  <!-- Scene bases (each on its own track, cross-faded) -->
  <div class="clip scene" id="sceneA" data-composition-id="s01-sceneA" data-start="0"     data-duration="7.10" data-track-index="1">
    <img class="photo" src="assets/photos/store.jpg" alt="">
    <div class="scrim-top"></div><div class="scrim-bottom"></div>
  </div>
  <div class="clip scene" id="sceneB" data-composition-id="s01-sceneB" data-start="6.52"  data-duration="8.98" data-track-index="3">
    <img class="photo" src="assets/photos/profit-coins.jpg" alt="">
    <div class="scrim-top"></div><div class="scrim-bottom"></div>
  </div>
  <div class="clip scene" id="sceneC" data-composition-id="s01-sceneC" data-start="14.94" data-duration="3.06" data-track-index="4">
    <img class="photo" src="assets/photos/magic-hat.jpg" alt="">
    <div class="scrim-top"></div><div class="scrim-bottom"></div>
  </div>
  <div class="clip scene" id="sceneD" data-composition-id="s01-sceneD" data-start="17.45" data-duration="2.05" data-track-index="5">
    <img class="photo" src="assets/photos/red-curtain.jpg" alt="">
    <div class="scrim-top"></div><div class="scrim-bottom"></div>
  </div>

  <!-- WIT layer -->
  <div class="wit-layer">
    <img class="wit" id="witSuspicion" src="assets/wit/wit-pose-price-tag-suspicion.png" alt="">
    <img class="wit" id="witShocked"   src="assets/wit/wit-pose-shocked.png" alt="">
    <!-- betrayed WIT spans scenes C+D; sprouts bunny ears on "rabbit" -->
    <div class="witwrap" id="witBetrayedWrap">
      <img class="wit" src="assets/wit/wit-pose-betrayed.png" alt="">
      <div class="ears" id="bunnyEars">
        <div class="ear left"></div>
        <div class="ear right"></div>
      </div>
    </div>
  </div>

  <!-- Hero cards / labels -->
  <div class="card-layer">
    <div class="label"      id="lblHook"  style="top:250px;">FREE  vs  ½ OFF?</div>
    <div class="label hot"  id="lblSame"  style="top:250px;">SAME $5 / item</div>
    <div class="label sub"  id="lblDoub"  style="top:430px;">…but FREE doubles the store's profit</div>
    <div class="math"       id="mHalf"    style="top:250px;">50% off: store keeps <span class="num">$1</span></div>
    <div class="math bogo"  id="mFree"    style="top:400px;">FREE: store keeps <span class="num">$2</span></div>
    <div class="stamp"      id="mDouble"  style="top:540px;">DOUBLE</div>
    <div class="magic"      id="lblMagic">A MAGIC TRICK</div>
    <div class="rabbit"     id="lblRabbit">YOU'RE<br>THE RABBIT</div>
  </div>

  <!-- Captions -->
  <div class="caption-layer">
    <div class="cap" id="cap1">Sounds impossible…</div>
    <div class="cap" id="cap2">Free - and earns MORE</div>
    <div class="cap" id="cap3">than half price</div>
    <div class="cap" id="cap4">That's not generosity</div>
  </div>

  <audio id="vo" data-start="0" data-duration="18.155" data-track-index="10" data-volume="1" crossorigin="anonymous" src="assets/../voiceover/short-01.mp3"></audio>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true, defaults:{ overwrite:"auto" } });
    window.__timelines["Short01"] = tl;

    // initial hidden states (don't zero the wit INSIDE the witwrap - the wrap controls it)
    gsap.set(['#sceneB','#sceneC','#sceneD'], { opacity:0 });
    gsap.set(['#witSuspicion','#witShocked','#witBetrayedWrap','.ears'], { opacity:0 });
    gsap.set(['.label','.math','.stamp','.magic','.rabbit','.cap'], { opacity:0 });

    const show = (sel,t)=> tl.set(sel,{opacity:1}, t);
    const hide = (sel,t)=> tl.set(sel,{opacity:0}, t);
    const pop  = (sel,t)=> tl.fromTo(sel,{opacity:0,scale:0.6},
                    {opacity:1,scale:1,duration:0.42,ease:'back.out(2)',immediateRender:false}, t);
    const fadeScene = (sel,t)=> tl.fromTo(sel,{opacity:0,filter:'blur(14px)'},
                    {opacity:1,filter:'blur(0px)',duration:0.5,immediateRender:false}, t);

    // ---- Scene A (greengrocer store) : the hook ----
    show('#witSuspicion', 0.0);
    show('#lblHook', 0.4);
    show('#cap1', 0.36); hide('#cap1', 2.10);
    pop('#cap2', 3.36);  hide('#cap2', 5.05);
    pop('#cap3', 5.18);  hide('#cap3', 6.40);

    // ---- Scene B (profit coins) : same $5, double profit, the math ----
    fadeScene('#sceneB', 6.52);
    hide('#witSuspicion', 6.52); show('#witShocked', 6.55); hide('#lblHook', 6.52);
    pop('#lblSame', 6.62);
    pop('#lblDoub', 10.66);
    hide('#lblSame', 12.00); hide('#lblDoub', 12.00);
    pop('#mHalf', 12.02);
    pop('#mFree', 13.70);
    pop('#mDouble', 14.66);

    // ---- Scene C (magic hat) : the MAGIC beat ----
    fadeScene('#sceneC', 14.94);
    hide('#witShocked', 14.94); show('#witBetrayedWrap', 14.97);
    hide('#mHalf', 14.94); hide('#mFree', 14.94); hide('#mDouble', 14.94);
    pop('#cap4', 14.96);  hide('#cap4', 16.40);
    pop('#lblMagic', 16.52);   // lands on the word "magic"

    // ---- Scene D (red curtain) : WIT becomes the RABBIT ----
    fadeScene('#sceneD', 17.45);
    hide('#lblMagic', 17.45);
    pop('#bunnyEars', 17.84);  // ears sprout on the word "rabbit"
    pop('#lblRabbit', 17.84);  // payoff card, holds to end
  </script>
</div>
</body>
</html>
