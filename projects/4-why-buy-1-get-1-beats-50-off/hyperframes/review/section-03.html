<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Section 03 - The Receipt Knows</title>
  <style>
    @font-face { font-family: "PatrickHandLocal"; src: url("./assets/fonts/patrick-hand-latin.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: block; }
    :root { --ink:#14110d; --red:#e0392b; --green:#3ddc7f; --gold:#ffd23f; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #07070a; color:#fff; overflow: hidden; }
    #Section03Receipt { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #07070a; font-family: "PatrickHandLocal"; }
    .scene, .cue { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; }
    .scene { z-index: 1; will-change: opacity, transform, filter; }
    .cue { z-index: 5; pointer-events: none; }
    .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .photo.cash  { filter:saturate(1.12) contrast(1.08) brightness(0.76); }
    .photo.coins { filter:saturate(1.1) contrast(1.1) brightness(0.70); }
    .photo.basket{ filter:saturate(1.18) contrast(1.08) brightness(0.74); }
    .photo.curtain{ filter:saturate(1.15) contrast(1.08) brightness(0.74); }
    .photo.cash2 { filter:saturate(1.2) contrast(1.1) brightness(0.66) hue-rotate(-8deg); }
    .scrim { position:absolute; inset:0; z-index:1; background:radial-gradient(ellipse 100% 100% at 50% 46%, rgba(4,5,10,0) 54%, rgba(4,5,10,0.38) 100%); }
    .ui { font-family:"Segoe UI",system-ui,sans-serif; }
    .hand { position:absolute; z-index:7; font-family:"PatrickHandLocal"; font-size:64px; color:#fff; text-shadow:3px 4px 0 rgba(0,0,0,0.6); }

    /* giant kinetic number */
    .bignum { position:absolute; z-index:9; font-family:"Segoe UI",system-ui,sans-serif; font-weight:900; line-height:0.86; color:#fff; text-shadow:0 0 46px rgba(255,255,255,0.28), 7px 9px 0 rgba(0,0,0,0.5); }
    .bignum .cap { display:block; font-size:46px; font-weight:800; color:#cfd3dc; text-shadow:2px 3px 0 rgba(0,0,0,0.5); margin-bottom:-6px; letter-spacing:1px; }
    .bignum .v { font-size:300px; }
    .bignum.red .v { color:var(--red); text-shadow:0 0 56px rgba(224,57,43,0.6), 7px 9px 0 rgba(0,0,0,0.5); }

    /* small receipt strip */
    .rstrip { position:absolute; z-index:8; background:#fdfdf6; color:#1a1a1a; font-family:"Courier New",monospace; font-weight:700; font-size:30px; padding:14px 22px; border-radius:6px; box-shadow:0 14px 30px rgba(0,0,0,0.6); }
    .rstrip small { display:block; font-size:22px; color:#777; font-weight:400; }

    /* popping toast */
    .toast { position:absolute; z-index:9; background:var(--red); color:#fff; font-family:"Segoe UI",system-ui,sans-serif; font-weight:800; font-size:38px; padding:14px 26px; border-radius:16px; box-shadow:0 16px 34px rgba(0,0,0,0.5); }

    /* stamps */
    .stamp { position:absolute; z-index:11; font-family:"Segoe UI",system-ui,sans-serif; font-weight:900; color:#fff; border:7px solid var(--red); background:rgba(224,57,43,0.16); border-radius:16px; padding:10px 26px; transform:rotate(-9deg); text-shadow:3px 4px 0 rgba(0,0,0,0.5); box-shadow:0 0 30px rgba(224,57,43,0.5); }

    /* big banner */
    .banner { position:absolute; z-index:10; font-family:"Segoe UI",system-ui,sans-serif; font-weight:900; line-height:0.92; color:#fff; text-shadow:0 0 40px rgba(0,0,0,0.7), 7px 8px 0 rgba(0,0,0,0.5); }
    .banner .sm { display:block; font-size:48px; color:#cfd3dc; }
    .banner .big { font-size:138px; color:var(--gold); }

    /* dueling labels */
    .duel { position:absolute; z-index:9; font-family:"Segoe UI",system-ui,sans-serif; font-weight:900; font-size:60px; text-shadow:4px 5px 0 rgba(0,0,0,0.5); }
    .duel.save { color:var(--green); } .duel.rob { color:var(--red); }

    /* price signs + payoff */
    .sign { position:absolute; z-index:8; border-radius:18px; padding:18px 30px; text-align:center; font-family:"Segoe UI",system-ui,sans-serif; box-shadow:0 16px 34px rgba(0,0,0,0.5); }
    .sign .top { font-weight:900; line-height:0.96; } .sign .sub { font-weight:700; margin-top:6px; }
    .sign.half { background:#f4f1e8; color:#1b1b1b; border:4px solid #b9b2a0; } .sign.half .top{font-size:62px;} .sign.half .sub{font-size:26px;color:#444;}
    .check { position:absolute; z-index:10; color:var(--green); font-family:"Segoe UI",system-ui,sans-serif; font-weight:900; font-size:120px; text-shadow:4px 5px 0 rgba(0,0,0,0.5); }
    .payoff { position:absolute; z-index:10; font-family:"Segoe UI",system-ui,sans-serif; font-weight:900; font-size:230px; line-height:0.9; color:var(--red); text-shadow:0 0 70px rgba(224,57,43,0.7), 8px 10px 0 rgba(0,0,0,0.5); letter-spacing:2px; }
    .magic { position:absolute; z-index:10; font-family:"PatrickHandLocal"; font-size:62px; color:var(--gold); text-shadow:0 0 26px rgba(255,210,63,0.6), 3px 4px 0 rgba(0,0,0,0.5); }

    .wit { position:absolute; object-fit:contain; z-index:8; filter:drop-shadow(16px 20px 0 rgba(0,0,0,0.34)); transform-origin:center center; }
    .hand,.bignum,.rstrip,.toast,.stamp,.banner,.duel,.sign,.check,.payoff,.magic,.wit { will-change: opacity, transform; }
  </style>
</head>
<body>
  <div id="Section03Receipt" data-composition-id="Section03Receipt" data-start="0" data-duration="32.235" data-width="1920" data-height="1080">

    <!-- SCENE A: cash 0-6.86 -->
    <div id="scene-a" class="clip scene" data-start="0" data-duration="6.86" data-track-index="1">
      <img class="photo cash" src="./assets/visual-references/section-03-the-receipt-knows/base-cash.jpg" alt=""><div class="scrim"></div>
    </div>
    <!-- SCENE B: coins 6.86-15.12 -->
    <div id="scene-b" class="clip scene" data-start="6.86" data-duration="8.26" data-track-index="3">
      <img class="photo coins" src="./assets/visual-references/section-03-the-receipt-knows/base-coins.jpg" alt=""><div class="scrim"></div>
    </div>
    <!-- SCENE C: basket 15.12-20.92 -->
    <div id="scene-c" class="clip scene" data-start="15.12" data-duration="5.80" data-track-index="4">
      <img class="photo basket" src="./assets/visual-references/section-03-the-receipt-knows/base-c-veg-basket.jpg" alt=""><div class="scrim"></div>
    </div>
    <!-- SCENE D: curtain 20.92-25.32 -->
    <div id="scene-d" class="clip scene" data-start="20.92" data-duration="4.40" data-track-index="5">
      <img class="photo curtain" src="./assets/visual-references/section-03-the-receipt-knows/base-curtain.jpg" alt=""><div class="scrim"></div>
    </div>
    <!-- SCENE E: cash (reuse, red) 25.32-32.235 -->
    <div id="scene-e" class="clip scene" data-start="25.32" data-duration="6.915" data-track-index="6">
      <img class="photo cash2" src="./assets/visual-references/section-03-the-receipt-knows/base-cash.jpg" alt=""><div class="scrim"></div>
    </div>

    <!-- CUE A 0-6.84 -->
    <div id="cue-a" class="clip cue" data-start="0" data-duration="6.84" data-track-index="2" data-layout-allow-overflow="" style="overflow: visible;">
      <div class="hand ca-label" style="left:120px; top:84px; width:820px;">what you actually spend…</div>
      <div class="rstrip ca-strip ui" style="left:150px; top:300px;">50% OFF<small>1 item · done</small></div>
      <div class="bignum ca-num" style="left:150px; top:420px;"><span class="cap">you pay</span> <span class="v" style="margin-top: 50px; display: block;">$5</span></div>
      <img class="wit ca-wit" data-layout-allow-overflow="" style="right:-120px; bottom:-330px; width:1180px;" src="./assets/wit/wit-pose-holding-receipt-evidence.png" alt="">
    </div>

    <!-- CUE B 6.86-15.10 -->
    <div id="cue-b" class="clip cue" data-start="6.86" data-duration="8.24" data-track-index="2" data-layout-allow-overflow="" style="overflow: visible;">
      <div class="rstrip cb-strip ui" style="left:120px; top:230px;">BUY 1 GET 1 FREE<small>2 items</small></div>
      <div class="bignum red cb-num" style="left:110px; top:360px;"><span class="cap">you pay</span><span class="v" style="margin-top: 50px; display: block;">$10</span></div>
      <div class="stamp cb-x2 ui" style="left:1410px; top:120px; font-size:74px;">&times;2<br><span style="font-size:34px;">TWICE AS MUCH</span></div>
      <div class="toast cb-plus1 ui" style="left:1440px; top:330px;">+1 you didn't need</div>
      <img class="wit cb-wit" data-layout-allow-overflow="" style="left:540px; bottom:-340px; width:1120px;" src="./assets/wit/wit-pose-receipt-attacked.png" alt="">
    </div>

    <!-- CUE C 15.12-20.90 -->
    <div id="cue-c" class="clip cue" data-start="15.12" data-duration="5.78" data-track-index="2" data-layout-allow-overflow="" style="overflow: visible;">
      <div class="banner cc-band" style="left:770px; top:230px;"><span class="sm">50% off = smaller price</span>BUY 1 GET 1 =<br><span class="big" style="margin-top: 20px; display: block;">BIGGER BASKET</span></div>
      <img class="wit cc-wit" data-layout-allow-overflow="" style="left:-160px; bottom:-340px; width:1180px;" src="./assets/wit/wit-pose-betrayed.png" alt="">
    </div>

    <!-- CUE D 20.92-25.30 -->
    <div id="cue-d" class="clip cue" data-start="20.92" data-duration="4.38" data-track-index="2" data-layout-allow-overflow="" style="overflow: visible;">
      <div class="duel save cd-save" style="left:120px; top:170px;">ONE saves your money…</div>
      <div class="duel rob cd-rob" style="left:120px; top:300px;">the OTHER robs you</div>
      <div class="stamp cd-robbed ui" style="left:170px; top:470px; font-size:84px;">ROBBED <span style="font-size:60px;">:)</span></div>
      <img class="wit cd-wit" data-layout-allow-overflow="" style="left:600px; bottom:-340px; width:1200px;" src="./assets/wit/wit-pose-empty-wallet.png" alt="">
    </div>

    <!-- CUE E 25.32-32.235 -->
    <div id="cue-e" class="clip cue" data-start="25.32" data-duration="6.915" data-track-index="2" data-layout-allow-overflow="" style="overflow: visible;">
      <div class="sign half ce-half" style="left:980px; top:600px;"><div class="top">50% OFF</div><div class="sub">$5 · one item · better deal</div></div>
      <div class="check ce-check" style="left:1170px; top:510px;">&check;</div>
      <div class="payoff ce-free" style="left:980px; top:250px;">FREE</div>
      <div class="magic ce-magic" style="left:1000px; top:185px;">the magic word →</div>
      <img class="wit ce-wit" data-layout-allow-overflow="" style="left:-170px; bottom:-330px; width:1120px;" src="./assets/wit/wit-pose-facepalm.png" alt="">
    </div>

    <audio id="voiceover-section-03" data-start="0" data-duration="32.235" data-track-index="10" data-volume="1" crossorigin="anonymous" src="./section-03-the-receipt-knows-david23-am_eric-0.82.mp3"></audio>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true, defaults: { overwrite: "auto" } });
      const reveal = (t, hideAt, at, fv, tv = {}) => { const r = {}; if ("x" in fv) r.x = 0; if ("y" in fv) r.y = 0; if ("scale" in fv) r.scale = 1; if ("opacity" in fv) r.opacity = 1; tl.set(t, fv, hideAt); tl.to(t, { ...r, ...tv }, at); };
      const show = (t, hideAt, at) => { tl.set(t, { opacity: 0 }, hideAt); tl.set(t, { opacity: 1 }, at); };
      const hide = (t, at) => { tl.set(t, { opacity: 0 }, at); };
      const smash = (t, hideAt, at, fv = { y: 20, scale: 1.3, opacity: 0 }) => reveal(t, hideAt, at, fv, { duration: 0.2, ease: "back.out(2)" });
      const pop = (t, hideAt, at) => reveal(t, hideAt, at, { scale: 0.4, opacity: 0 }, { duration: 0.22, ease: "back.out(2)" });

      // scene cross-fades
      tl.fromTo("#scene-b", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "sine.out", immediateRender: false }, 6.86);
      tl.fromTo("#scene-c", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "sine.out", immediateRender: false }, 15.12);
      tl.fromTo("#scene-d", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "sine.out", immediateRender: false }, 20.92);
      tl.fromTo("#scene-e", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "sine.out", immediateRender: false }, 25.32);

      // SCENE A — what you spend ($5)
      show("#cue-a .ca-label", 0, 1.78);
      show("#cue-a .ca-wit", 0, 1.95);
      show("#cue-a .ca-strip", 0, 3.20);                        // "fifty percent off"
      smash("#cue-a .ca-num", 0, 5.40, { y: 30, scale: 0.5, opacity: 0 }); // "paid five"

      // SCENE B — full ten, twice as much
      show("#cue-b .cb-strip", 6.86, 6.95);                     // "buy one get one free"
      hide("#cue-b .cb-num", 6.86); hide("#cue-b .cb-x2", 6.86); hide("#cue-b .cb-plus1", 6.86);
      show("#cue-b .cb-wit", 6.86, 7.10);
      smash("#cue-b .cb-num", 6.86, 8.78, { y: 34, scale: 0.5, opacity: 0 });  // "the full ten"
      smash("#cue-b .cb-x2", 6.86, 10.62, { scale: 0.4, opacity: 0 });         // "twice as much"
      pop("#cue-b .cb-plus1", 6.86, 12.82);                     // "a second one you did not need"

      // SCENE C — bigger basket
      hide("#cue-c .cc-band", 15.12);
      show("#cue-c .cc-wit", 15.12, 15.30);
      // reveal "smaller price" line first, then the BIGGER BASKET on its word via the band container
      show("#cue-c .cc-band", 15.12, 16.32);                    // "smaller price"
      tl.set("#cue-c .cc-band .big", { opacity: 0, scale: 0.5 }, 15.12);
      tl.to("#cue-c .cc-band .big", { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(2)" }, 20.02); // "bigger basket"

      // SCENE D — robs you while smiling
      hide("#cue-d .cd-rob", 20.92); hide("#cue-d .cd-robbed", 20.92); hide("#cue-d .cd-wit", 20.92);
      show("#cue-d .cd-save", 20.92, 21.00);                    // "one saves your money"
      show("#cue-d .cd-rob", 20.92, 22.36);                     // "the other ... robs you"
      show("#cue-d .cd-wit", 20.92, 22.20);
      smash("#cue-d .cd-robbed", 20.92, 24.52, { scale: 0.4, opacity: 0 });    // "robs you"

      // SCENE E — half price better / magic word
      show("#cue-e .ce-half", 25.32, 25.55);
      hide("#cue-e .ce-check", 25.32); hide("#cue-e .ce-free", 25.32); hide("#cue-e .ce-magic", 25.32); hide("#cue-e .ce-wit", 25.32);
      smash("#cue-e .ce-check", 25.32, 27.48, { scale: 0.4, opacity: 0 });     // "better deal"
      show("#cue-e .ce-wit", 25.32, 28.60);                     // "walked right past it"
      smash("#cue-e .ce-free", 25.32, 31.62, { scale: 0.5, opacity: 0 });      // "the magic word"
      show("#cue-e .ce-magic", 25.32, 31.62);

      window.__timelines["Section03Receipt"] = tl;
    </script>
  </div>
</body>
</html>
