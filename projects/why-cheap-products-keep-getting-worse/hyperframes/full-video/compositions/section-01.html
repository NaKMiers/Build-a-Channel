<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Section 01 Hook - Why Cheap Products Keep Getting Worse</title>
  <style>
    @font-face {
      font-family: "PatrickHandLocal";
      src: url("./assets/fonts/patrick-hand-latin.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }

    :root {
      --paper: #f2eadb;
      --ink: #17120f;
      --muted-ink: #4d3a2b;
      --sale: #efc63d;
      --red: #7d1714;
      --red-text: #210403;
      --blue: #d8e7ee;
      --cream: #fff7d8;
      --shadow: rgba(45, 29, 16, 0.24);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      overflow: hidden;
    }

    #Section01Hook {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 12%, rgba(255, 255, 255, 0.58), transparent 30%),
        linear-gradient(180deg, #f5eedf 0%, #e7d7bf 100%);
      font-family: "PatrickHandLocal";
    }

    .scene,
    .cue {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .scene {
      z-index: 1;
      background: var(--paper);
      will-change: opacity, transform, filter;
    }

    .cue {
      z-index: 5;
      pointer-events: none;
    }

    .photo {
      position: absolute;
      object-fit: cover;
      filter: saturate(0.96) contrast(1.04);
      user-select: none;
      pointer-events: none;
    }

    .photo.full {
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .photo.failure {
      left: -42px;
      top: -18px;
      width: 2005px;
      height: 1128px;
    }

    .photo.desk {
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .shade {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(23, 18, 15, 0.28), rgba(23, 18, 15, 0.04) 42%, rgba(23, 18, 15, 0.12)),
        linear-gradient(0deg, rgba(23, 18, 15, 0.20), transparent 44%);
      z-index: 2;
    }

    .label {
      position: absolute;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 160px;
      min-height: 72px;
      padding: 16px 30px 20px;
      background: var(--cream);
      border: 7px solid var(--ink);
      border-radius: 7px;
      box-shadow: 12px 14px 0 rgba(23, 18, 15, 0.20);
      color: var(--ink);
      font-size: 70px;
      line-height: 0.9;
      text-align: center;
      letter-spacing: 0;
      transform: rotate(-2deg);
      z-index: 8;
    }

    .label.small {
      font-size: 46px;
      line-height: 0.98;
      padding: 14px 24px 18px;
    }

    .label.tiny {
      font-size: 31px;
      line-height: 1.02;
      padding: 10px 18px 13px;
      border-width: 4px;
      box-shadow: 7px 8px 0 rgba(23, 18, 15, 0.16);
    }

    .label.blue {
      background: var(--blue);
    }

    .label.yellow {
      background: var(--sale);
    }

    .label.red {
      background: #fff7f2;
      color: var(--red-text);
      border-color: var(--red);
    }

    .label.dark {
      background: rgba(23, 18, 15, 0.88);
      border-color: var(--cream);
      color: #fffaf0;
      text-shadow: 0 5px 0 rgba(0, 0, 0, 0.34);
    }

    .wit {
      position: absolute;
      object-fit: contain;
      z-index: 9;
      filter: drop-shadow(13px 17px 0 rgba(23, 18, 15, 0.18));
      transform-origin: center center;
    }

    .wit.behind {
      z-index: 7;
    }

    .wit.giant {
      filter: drop-shadow(18px 21px 0 rgba(23, 18, 15, 0.20));
    }

    .price-tag {
      position: absolute;
      width: 260px;
      height: 360px;
      background: var(--sale);
      border: 7px solid var(--ink);
      clip-path: polygon(16% 0, 100% 0, 100% 100%, 0 100%, 0 16%);
      box-shadow: 13px 15px 0 rgba(23, 18, 15, 0.16);
      z-index: 8;
      transform: rotate(6deg);
    }

    .price-tag::before {
      content: "";
      position: absolute;
      left: 44px;
      top: 40px;
      width: 30px;
      height: 30px;
      border: 7px solid var(--ink);
      border-radius: 50%;
      background: var(--paper);
    }

    .price-tag .tag-text {
      position: absolute;
      inset: 92px 24px 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      font-size: 104px;
      line-height: 0.82;
      text-align: center;
    }

    .stamp {
      position: absolute;
      padding: 14px 28px 19px;
      color: var(--red-text);
      border: 9px solid var(--red);
      background: #fff7f2;
      font-size: 84px;
      line-height: 0.86;
      transform: rotate(-11deg);
      z-index: 9;
    }

    .tiny-note {
      position: absolute;
      padding: 12px 18px;
      background: rgba(255, 250, 240, 0.94);
      border: 4px solid var(--ink);
      color: var(--ink);
      font-size: 28px;
      line-height: 1.05;
      z-index: 8;
    }

    .future-dangle {
      position: absolute;
      left: 1132px;
      top: 682px;
      width: 178px;
      height: 232px;
      padding: 66px 18px 18px;
      background: #fff5dd;
      border: 5px solid var(--ink);
      box-shadow: 9px 11px 0 rgba(23, 18, 15, 0.18);
      color: var(--ink);
      font-size: 35px;
      line-height: 0.82;
      text-align: center;
      transform: rotate(8deg);
      z-index: 8;
    }

    .future-dangle::before {
      content: "";
      position: absolute;
      left: 73px;
      top: 28px;
      width: 24px;
      height: 24px;
      border: 5px solid var(--ink);
      border-radius: 50%;
      background: var(--paper);
    }

    .mini-calendar {
      position: absolute;
      left: 95px;
      top: 120px;
      display: grid;
      grid-template-columns: repeat(7, 74px);
      grid-template-rows: 62px repeat(2, 70px);
      gap: 9px;
      padding: 22px;
      background: #fff9ea;
      border: 7px solid var(--ink);
      box-shadow: 15px 17px 0 rgba(23, 18, 15, 0.17);
      transform: rotate(-1deg);
      z-index: 8;
    }

    .mini-calendar .head {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--sale);
      border: 4px solid var(--ink);
      font-size: 44px;
      line-height: 1;
    }

    .mini-calendar .day {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      border: 4px solid var(--ink);
      font-size: 40px;
      line-height: 1;
    }

    .sound-lines {
      position: absolute;
      left: 960px;
      top: 356px;
      z-index: 8;
      width: 310px;
      height: 240px;
    }

    .sound-lines span {
      position: absolute;
      display: block;
      width: 190px;
      height: 8px;
      background: var(--red);
      border-radius: 999px;
      transform-origin: left center;
    }

    .sound-lines span:nth-child(1) { transform: rotate(-22deg); left: 10px; top: 44px; }
    .sound-lines span:nth-child(2) { transform: rotate(0deg); left: 54px; top: 106px; width: 235px; }
    .sound-lines span:nth-child(3) { transform: rotate(20deg); left: 12px; top: 168px; }

    .red-circle {
      position: absolute;
      width: 230px;
      height: 156px;
      border: 12px solid var(--red);
      border-radius: 50%;
      z-index: 8;
      transform: rotate(-10deg);
    }

    .arrow {
      position: absolute;
      color: var(--red);
      font-size: 120px;
      line-height: 1;
      z-index: 8;
      transform: rotate(-12deg);
    }

    .job-note {
      position: absolute;
      right: 500px;
      bottom: 114px;
      width: 440px;
      padding: 28px 32px;
      background: #fffdf5;
      border: 6px solid var(--ink);
      box-shadow: 12px 14px 0 rgba(23, 18, 15, 0.17);
      font-size: 40px;
      line-height: 1.02;
      transform: rotate(2deg);
      z-index: 8;
    }

    .receipt {
      position: absolute;
      right: 118px;
      top: 105px;
      width: 500px;
      min-height: 650px;
      padding: 54px;
      background: #fffdf5;
      border: 7px solid var(--ink);
      box-shadow: 16px 18px 0 rgba(23, 18, 15, 0.17);
      z-index: 8;
      transform: rotate(2deg);
    }

    .receipt h2 {
      margin: 0 0 30px;
      font-size: 70px;
      line-height: 0.86;
      letter-spacing: 0;
    }

    .receipt p {
      display: flex;
      justify-content: space-between;
      align-items: center;
      min-height: 60px;
      margin: 20px 0;
      border-bottom: 3px dotted rgba(23, 18, 15, 0.45);
      font-size: 29px;
      line-height: 1.2;
    }

    .receipt .bad {
      color: var(--red);
      font-weight: 700;
    }

    .receipt .total {
      margin-top: 36px;
      padding-top: 26px;
      min-height: 116px;
      border-top: 7px solid var(--ink);
      border-bottom: 0;
      font-size: 54px;
      line-height: 1.05;
    }

    .final-tag {
      position: absolute;
      left: 105px;
      top: 154px;
      width: 720px;
      min-height: 535px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 54px;
      background: #fff6dc;
      border: 10px solid var(--ink);
      box-shadow: 24px 28px 0 rgba(23, 18, 15, 0.18);
      transform: rotate(-2deg);
      z-index: 8;
    }

    .final-tag::before {
      content: "";
      position: absolute;
      left: 58px;
      top: 58px;
      width: 40px;
      height: 40px;
      border: 10px solid var(--ink);
      border-radius: 50%;
      background: var(--paper);
    }

    .final-tag h1 {
      max-width: 585px;
      margin: 0;
      color: var(--ink);
      font-size: 116px;
      line-height: 0.78;
      text-align: center;
      letter-spacing: 0;
    }

    .label,
    .wit,
    .price-tag,
    .stamp,
    .tiny-note,
    .future-dangle,
    .mini-calendar,
    .sound-lines,
    .red-circle,
    .arrow,
    .receipt,
    .final-tag {
      will-change: opacity, transform;
    }
  </style>
</head>
<body>
  <div id="Section01Hook" data-composition-id="Section01Hook" data-start="0" data-duration="21.205" data-width="1920" data-height="1080">
    
    <div id="scene-chair-base" class="clip scene" data-start="0" data-duration="8.62" data-track-index="1">
      <img class="photo full" src="./assets/visual-references/section-01-hook/generated/chair-price-tag-generated.png" alt="">
      <div class="shade"></div>
    </div>

    <div id="scene-failure-base" class="clip scene" data-start="8.4" data-duration="8.18" data-track-index="3">

    <div id="scene-cost-base" class="clip scene" data-start="16.4" data-duration="4.805" data-track-index="4">
      <img class="photo desk" src="./assets/visual-references/section-01-hook/generated/price-tag-receipt-generated.png" alt="">
    </div>

    <div id="cue-chair-price" class="clip cue" data-start="0" data-duration="2.2" data-track-index="2">

      <img class="wit giant behind" data-layout-allow-overflow="" style="right: -320px; bottom: -660px; width: 1400px;" src="./assets/wit/wit-pose-awkward-celebration.png" alt="">
    </div>

    <div id="cue-legal-creak" class="clip cue" data-start="8.4" data-duration="2.85" data-track-index="2">
      <div class="label red" style="right: 116px; top: 90px; width: 560px;">LEGAL-ISH<br>CREAK</div>
      <div class="sound-lines" data-layout-ignore="">
        <span></span>
        <span></span>
        <span></span>
      </div>
      
    </div>

    <div data-hf-studio-original-inline-translate="" data-hf-studio-original-translate="" data-hf-studio-path-offset="true" style="--hf-studio-offset-x:-66px;--hf-studio-offset-y:0px;translate:var(--hf-studio-offset-x, 0px) var(--hf-studio-offset-y, 0px)" id="cue-chair-failure" class="clip cue" data-start="11.25" data-duration="5.05" data-track-index="2">
      <div class="red-circle" style="left: 1142px; top: 848px; width: 248px; height: 130px;"></div>
      <div data-hf-studio-original-inline-translate="" data-hf-studio-original-translate="" data-hf-studio-path-offset="true" class="arrow" style="left:1030px;top:824px;--hf-studio-offset-x:-83px;--hf-studio-offset-y:12px;translate:var(--hf-studio-offset-x, 0px) var(--hf-studio-offset-y, 0px)">-&gt;</div>

      <div class="label red cheap-label" style="left: 560px; top: 95px; width: 570px;">NOT REALLY<br>CHEAP</div>

    <div id="cue-final-tag" class="clip cue" data-start="18.85" data-duration="2.355" data-track-index="2">

      </div>
      <div class="stamp" style="left: 150px; bottom: 104px;">SMALL<br>PROBLEM</div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({
        paused: true,
        defaults: { overwrite: "auto" },
      });

      const reveal = (target, hideAt, at, fromVars, toVars = {}) => {
        const resetVars = {};
        if (Object.prototype.hasOwnProperty.call(fromVars, "x")) resetVars.x = 0;
        if (Object.prototype.hasOwnProperty.call(fromVars, "y")) resetVars.y = 0;
        if (Object.prototype.hasOwnProperty.call(fromVars, "scale")) resetVars.scale = 1;
        if (Object.prototype.hasOwnProperty.call(fromVars, "scaleX")) resetVars.scaleX = 1;
        if (Object.prototype.hasOwnProperty.call(fromVars, "opacity")) resetVars.opacity = 1;

        tl.set(target, fromVars, hideAt);
        tl.to(target, { ...resetVars, ...toVars }, at);
      };

      const show = (target, hideAt, at) => {
        tl.set(target, { opacity: 0 }, hideAt);
        tl.set(target, { opacity: 1 }, at);
      };

      const smash = (target, hideAt, at, fromVars = { y: 24, scale: 1.34, opacity: 0 }) => {
        reveal(target, hideAt, at, fromVars, { duration: 0.18, ease: "back.out(1.9)" });
      };

      tl.fromTo(
        "#scene-failure-base",
        { opacity: 0, scale: 1.012, filter: "blur(7px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.22, ease: "sine.out", immediateRender: false },
        8.4
      );
      tl.fromTo(
        "#scene-cost-base",
        { opacity: 0, scale: 1.01, filter: "blur(6px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.22, ease: "sine.out", immediateRender: false },
        16.4
      );

      show("#cue-chair-price .chair-find-label", 0, 0.12);
      show("#cue-chair-price .wit", 0, 0.42);
      smash("#cue-chair-price .dollar-tag", 0, 1.08);

      show("#cue-product-details .legs-label", 2.2, 2.36);
      show("#cue-product-details .confidence-label", 2.2, 3.42);

      show("#cue-sold-week .buy-label", 5.35, 5.70);
      show("#cue-sold-week .mini-calendar", 5.35, 6.72);
      show("#cue-sold-week .wit", 5.35, 6.98);
      show("#cue-sold-week .fine-label", 5.35, 7.22);

      show("#cue-legal-creak .sound-lines span", 8.4, 8.92);
      show("#cue-legal-creak .label", 8.4, 9.72);

      reveal("#cue-chair-failure .red-circle", 11.25, 11.42, { scale: 0.9, opacity: 0 }, { duration: 0.18, ease: "back.out(1.5)" });
      reveal("#cue-chair-failure .arrow", 11.25, 11.52, { x: -24, opacity: 0 }, { duration: 0.18, ease: "power2.out" });
      show("#cue-chair-failure .label.red[style*='right']", 11.25, 11.58);
      show("#cue-chair-failure .wit", 11.25, 13.18);
      show("#cue-chair-failure .label.red[style*='left']", 11.25, 13.62);

      show("#cue-true-cost .cheap-label", 16.4, 17.34);

      show("#cue-final-tag .stamp", 18.85, 19.10);
      show("#cue-final-tag .wit", 18.85, 19.28);
      smash("#cue-final-tag .final-tag", 18.85, 19.86, { scale: 1.12, opacity: 0 });
      window.__timelines["Section01Hook"] = tl;
    </script>
