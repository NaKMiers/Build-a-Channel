<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Section 08 Outro: Like, Share, Subscribe - Why The Internet Is Full Of Garbage Now</title>
  <style>
    @font-face { font-family:"PatrickHandLocal"; src:url("./assets/fonts/patrick-hand-latin.woff2") format("woff2"); font-weight:400; font-style:normal; font-display:block; }
    :root { --ink:#14110d; --red:#e0392b; --green:#1db954; --gold:#ffd23f; --cream:#fff7d8; --ytred:#ff0033; --ytblue:#3ea6ff; }
    * { box-sizing:border-box; }
    body { margin:0; background:#07070a; color:#fff; overflow:hidden; }
    #Section08Outro { position:relative; width:1920px; height:1080px; overflow:hidden; background:#07070a; font-family:"PatrickHandLocal"; }
    .scene { position:absolute; inset:0; width:100%; height:100%; z-index:1; }
    .photo { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .b-bright { filter:saturate(1.12) contrast(1.05) brightness(0.9); }
    .vig { position:absolute; inset:0; z-index:2; background:radial-gradient(ellipse 92% 92% at 56% 50%, rgba(4,5,10,0) 52%, rgba(4,5,10,0.5) 100%); }

    .wit  { position:absolute; object-fit:contain; z-index:8; filter:drop-shadow(14px 16px 0 rgba(0,0,0,0.3)); transform-origin:center center; }

    .hand { position:absolute; z-index:9; font-family:"PatrickHandLocal"; color:var(--cream); text-shadow:3px 4px 0 rgba(0,0,0,0.7); line-height:1.05; }
    .h56 { font-size:62px; } .h72 { font-size:80px; }
    .wordmark { position:absolute; z-index:9; font-family:"Segoe UI",system-ui,sans-serif; font-weight:900; font-size:40px; letter-spacing:1px; color:var(--gold); text-shadow:2px 3px 0 rgba(0,0,0,0.6); }

    /* ===== fake YouTube card ===== */
    .yt { position:absolute; left:720px; top:140px; width:1080px; height:800px; z-index:5; background:#0f0f0f; border-radius:26px; border:2px solid #272727; box-shadow:0 34px 70px rgba(0,0,0,0.65); overflow:hidden; transform-origin:center center; }
    .yt-top { position:absolute; left:0; top:0; right:0; height:66px; background:#0b0b0b; border-bottom:1px solid #222; display:flex; align-items:center; gap:14px; padding:0 28px; }
    .yt-logo { position:relative; width:62px; height:44px; background:var(--ytred); border-radius:12px; }
    .yt-logo::after { content:""; position:absolute; left:24px; top:13px; width:0; height:0; border-left:20px solid #fff; border-top:11px solid transparent; border-bottom:11px solid transparent; }
    .yt-wm { font-family:"Segoe UI",system-ui,sans-serif; font-weight:900; font-size:34px; letter-spacing:-1px; color:#fff; }
    .yt-search { position:absolute; right:28px; top:16px; width:340px; height:34px; background:#121212; border:1px solid #303030; border-radius:18px; }

    .yt-video { position:absolute; left:32px; top:88px; width:1016px; height:392px; border-radius:16px; background:linear-gradient(135deg,#202a3a 0%,#0e1320 60%,#161019 100%); overflow:hidden; }
    .yt-video::before { content:""; position:absolute; inset:0; background:radial-gradient(circle at 50% 42%, rgba(255,210,63,0.12), rgba(0,0,0,0) 60%); }
    .yt-play { position:absolute; left:50%; top:42%; transform:translate(-50%,-50%); width:0; height:0; border-left:62px solid rgba(255,255,255,0.92); border-top:38px solid transparent; border-bottom:38px solid transparent; filter:drop-shadow(0 6px 14px rgba(0,0,0,0.6)); }
    .yt-vtext { position:absolute; left:0; right:0; bottom:60px; text-align:center; font-family:"Segoe UI",system-ui,sans-serif; font-weight:900; font-size:62px; letter-spacing:2px; color:rgba(255,255,255,0.9); text-shadow:0 4px 18px rgba(0,0,0,0.7); }
    .yt-dur { position:absolute; right:16px; bottom:16px; background:rgba(0,0,0,0.82); color:#fff; font-family:"Segoe UI",sans-serif; font-weight:700; font-size:26px; padding:4px 12px; border-radius:7px; }

    .yt-title { position:absolute; left:32px; top:498px; width:1016px; font-family:"Segoe UI",system-ui,sans-serif; font-weight:800; font-size:42px; color:#f1f1f1; line-height:1.12; }

    .yt-ava { position:absolute; left:32px; top:556px; width:88px; height:88px; border-radius:50%; overflow:hidden; background:#f0a800; box-shadow:0 6px 16px rgba(0,0,0,0.5); }
    .yt-ava img { width:100%; height:100%; object-fit:cover; display:block; }
    .yt-cname { position:absolute; left:140px; top:562px; font-family:"Segoe UI",sans-serif; font-weight:800; font-size:38px; color:#fff; }
    .yt-subs  { position:absolute; left:140px; top:614px; font-family:"Segoe UI",sans-serif; font-weight:600; font-size:28px; color:#aaa; }
    .yt-subs2 { position:absolute; left:140px; top:614px; font-family:"Segoe UI",sans-serif; font-weight:800; font-size:28px; color:var(--gold); opacity:0; white-space:nowrap; }
    .thanks  { position:absolute; left:560px; top:652px; z-index:7; font-family:"Segoe UI",sans-serif; font-weight:900; font-size:40px; color:var(--green); opacity:0; text-shadow:0 3px 8px rgba(0,0,0,0.7); white-space:nowrap; }

    /* subscribe button (two stacked states) */
    .subwrap { position:absolute; left:700px; top:556px; width:348px; height:82px; z-index:6; transform-origin:center center; }
    .subbtn { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:18px; padding:0 34px; border-radius:42px; font-family:"Segoe UI",sans-serif; font-weight:900; font-size:38px; letter-spacing:0.5px; white-space:nowrap; box-shadow:0 10px 26px rgba(0,0,0,0.5); }
    .sub-red  { background:var(--ytred); color:#fff; }
    .sub-done { background:#272727; color:#cfcfcf; border:2px solid #3a3a3a; opacity:0; }
    .glowring { position:absolute; left:686px; top:540px; width:376px; height:114px; z-index:5; border-radius:58px; border:5px solid var(--gold); box-shadow:0 0 34px rgba(255,210,63,0.8), inset 0 0 22px rgba(255,210,63,0.5); opacity:0; transform-origin:center center; }

    /* action pills */
    .likewrap  { position:absolute; left:32px; top:684px; width:230px; height:80px; z-index:6; transform-origin:center center; }
    .sharewrap { position:absolute; left:286px; top:684px; width:222px; height:80px; z-index:6; transform-origin:center center; }
    .pill { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:16px; padding:0 28px; border-radius:40px; font-family:"Segoe UI",sans-serif; font-weight:800; font-size:36px; color:#fff; background:#272727; border:2px solid #3a3a3a; }
    .pill.on { background:#10324f; border-color:var(--ytblue); color:var(--ytblue); opacity:0; }

    .toast { position:absolute; left:1004px; top:756px; z-index:11; font-family:"Segoe UI",sans-serif; font-weight:800; font-size:34px; color:#fff; background:#1db954; border-radius:14px; padding:10px 22px; box-shadow:0 10px 24px rgba(0,0,0,0.5); white-space:nowrap; opacity:0; }

    /* inline-SVG icons (fill currentColor so they inherit each button's text color) */
    .svgic { flex:0 0 auto; display:block; }

    /* confetti */
    .confetti { position:absolute; left:870px; top:586px; width:10px; height:10px; z-index:7; opacity:0; }
    .cfp { position:absolute; left:0; top:0; width:20px; height:20px; border-radius:3px; }
    .cfp:nth-child(6n+1){ background:var(--gold);} .cfp:nth-child(6n+2){ background:var(--ytred);}
    .cfp:nth-child(6n+3){ background:var(--green);} .cfp:nth-child(6n+4){ background:var(--ytblue);}
    .cfp:nth-child(6n+5){ background:#fff;} .cfp:nth-child(6n+6){ background:#ff8ad8;}

    /* mouse cursor */
    .cursor { position:absolute; left:1500px; top:1000px; z-index:20; opacity:0; transform-origin:6px 4px; filter:drop-shadow(2px 3px 3px rgba(0,0,0,0.5)); }

    .wit,.hand,.wordmark,.yt,.subwrap,.likewrap,.sharewrap,.glowring,.toast,.cursor,.confetti,.thanks { will-change:opacity, transform; }
  </style>
</head>
<body>
  <div id="Section08Outro" data-composition-id="Section08Outro" data-start="0" data-duration="7.957" data-width="1920" data-height="1080">

    <!-- SCENE 8 (single continuous scene) - "If this helped, like the video, share it, and subscribe for more. See you in the next one." -->
    <div id="scene-1" class="scene clip" data-start="0" data-duration="7.957" data-track-index="1" data-layout-allow-overflow="" style="overflow:visible;">
      <img class="photo b-bright" src="./assets/bright-window-calm-1.jpg" alt="">
      <div class="vig"></div>

      <!-- fake YouTube card -->
      <div class="yt" id="ytcard">
        <div class="yt-top">
          <span class="yt-logo"></span>
          <span class="yt-wm">WhyTube</span>
          <span class="yt-search"></span>
        </div>
        <div class="yt-video">
          <div class="yt-play"></div>
          <div class="yt-vtext">WHY IT WORKS</div>
          <div class="yt-dur">5:00</div>
        </div>
        <div class="yt-title">Why The Internet Is Full Of Garbage Now</div>
        <div class="yt-ava"><img src="./assets/channel-avatar.png" alt="Why It Works"></div>
        <div class="yt-cname">Why It Works</div>
        <div class="yt-subs"  id="subs1">Subscribe for more</div>
        <div class="yt-subs2" id="subs2">Welcome to the channel!</div>
        <div class="thanks" id="thanks">Thanks!</div>

        <div class="glowring" id="glow"></div>
        <div class="subwrap" id="subwrap">
          <div class="subbtn sub-red"  id="subRed">SUBSCRIBE</div>
          <div class="subbtn sub-done" id="subDone"><svg class="svgic bellic" width="40" height="40" viewBox="0 0 24 24" fill="currentColor"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5S10.5 3.17 10.5 4v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>SUBSCRIBED</div>
        </div>

        <div class="likewrap" id="likewrap">
          <div class="pill" id="likeOff"><svg class="svgic" width="40" height="40" viewBox="0 0 24 24" fill="currentColor"><path d="M2 21h2.5V10H2v11zm20-10c0-1.1-.9-2-2-2h-5.7l.86-4.14.03-.32c0-.41-.17-.79-.44-1.06L13.67 2 7.6 8.1c-.37.36-.6.87-.6 1.4v9.5c0 1.1.9 2 2 2h8c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-1z"/></svg>247</div>
          <div class="pill on" id="likeOn"><svg class="svgic" width="40" height="40" viewBox="0 0 24 24" fill="currentColor"><path d="M2 21h2.5V10H2v11zm20-10c0-1.1-.9-2-2-2h-5.7l.86-4.14.03-.32c0-.41-.17-.79-.44-1.06L13.67 2 7.6 8.1c-.37.36-.6.87-.6 1.4v9.5c0 1.1.9 2 2 2h8c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-1z"/></svg>248</div>
        </div>
        <div class="sharewrap" id="sharewrap">
          <div class="pill"><svg class="svgic" width="42" height="34" viewBox="0 0 24 24" fill="currentColor"><path d="M14 9V5l7 7-7 7v-4c-5 0-8.5 1.5-11 5 1-5 4-9 11-10z"/></svg>Share</div>
        </div>

        <div class="confetti" id="confetti">
          <i class="cfp"></i><i class="cfp"></i><i class="cfp"></i><i class="cfp"></i><i class="cfp"></i><i class="cfp"></i>
          <i class="cfp"></i><i class="cfp"></i><i class="cfp"></i><i class="cfp"></i><i class="cfp"></i><i class="cfp"></i>
        </div>
      </div>

      <div class="toast" id="toast">Link copied!</div>

      <!-- mouse cursor (inline SVG arrow) -->
      <svg class="cursor" id="cursor" width="66" height="66" viewBox="0 0 24 24"><path d="M3 2 L3 20.5 L8 15.5 L11.2 22 L14.2 20.6 L11 14.2 L18 14.2 Z" fill="#ffffff" stroke="#111111" stroke-width="1.5" stroke-linejoin="round"/></svg>

      <!-- captions -->
      <div class="hand h56 s-helped" id="helped" style="left:60px; top:44px;">if this helped...</div>
      <div class="hand h72 s-bye" id="bye" style="left:60px; top:44px; opacity:0;">see you in the<br>next one.</div>
      <div class="wordmark s-mark" id="mark" style="left:64px; top:230px; opacity:0;">WHY IT WORKS</div>

      <!-- WIT -->
      <img class="wit s-wit" id="witPoint" data-layout-allow-overflow="" style="left:-30px; bottom:-120px; width:740px;" src="./assets/poses/enthusiastic_point_big_smile.png" alt="">
      <img class="wit s-wit2" id="witPeace" data-layout-allow-overflow="" style="left:-10px; bottom:-120px; width:720px; opacity:0;" src="./assets/poses/peace_sign_calm_open_mouth.png" alt="">
    </div>

    <audio id="voiceover-section-08" data-start="0" data-duration="7.957" data-track-index="30" data-volume="1" crossorigin="anonymous" src="./section-08.mp3"></audio>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused:true, defaults:{ overwrite:"auto" } });

      const show    = (t, hideAt, at) => { tl.set(t,{opacity:0},hideAt); tl.set(t,{opacity:1},at); };
      const fadeIn  = (sel, at, d=0.26) => tl.fromTo(sel,{opacity:0},{opacity:1,duration:d,ease:"sine.out",immediateRender:false}, at);
      const fadeOut = (sel, at, d=0.3) => tl.to(sel,{opacity:0,duration:d,ease:"sine.in"}, at);
      const popIn   = (sel, at) => tl.fromTo(sel,{scale:0.78,opacity:0},{scale:1,opacity:1,duration:0.34,ease:"back.out(2)",immediateRender:false}, at);
      const moveTo  = (sel, left, top, at, d=0.55) => tl.to(sel,{left:left,top:top,duration:d,ease:"power2.inOut"}, at);
      // combined wiggle+pop "boing" on a button wrap
      const boing = (sel, at) => {
        tl.to(sel,{scale:1.22,rotation:-5,duration:0.10,ease:"power2.out"},at);
        tl.to(sel,{scale:0.9, rotation:6, duration:0.10},at+0.10);
        tl.to(sel,{scale:1.08,rotation:-3,duration:0.10},at+0.20);
        tl.to(sel,{scale:1,   rotation:0, duration:0.16,ease:"sine.out"},at+0.30);
      };
      // cursor press dip
      const clickdip = (sel, at) => { tl.to(sel,{scale:0.78,duration:0.07,ease:"power2.in"},at); tl.to(sel,{scale:1,duration:0.13,ease:"back.out(2)"},at+0.07); };

      // ----- initial states -----
      tl.set("#cursor",{left:1500,top:1000,opacity:0,scale:1},0);
      show("#witPoint",0,0.18);
      popIn("#ytcard",0.30);

      // "if this helped..." 1.42
      show("#helped",0,1.42);

      // cursor flies in and heads to LIKE
      fadeIn("#cursor",1.62,0.2);
      moveTo("#cursor",856,852,1.66,0.52);

      // LIKE click 2.24 -> boing + turn blue "Liked" (13K) + count cue
      clickdip("#cursor",2.24);
      boing("#likewrap",2.24);
      tl.set("#likeOff",{opacity:0},2.30); tl.set("#likeOn",{opacity:1},2.30);

      // move to SHARE -> click 3.14 -> boing + "Link copied!" toast
      moveTo("#cursor",1094,852,2.50,0.5);
      clickdip("#cursor",3.14);
      boing("#sharewrap",3.14);
      popIn("#toast",3.18);
      fadeOut("#toast",4.10,0.3);

      // attention glow pulses on SUBSCRIBE (3.6 -> 5.2)
      show("#glow",0,3.60);
      tl.to("#glow",{scale:1.12,opacity:1,duration:0.34,ease:"sine.inOut"},3.60);
      tl.to("#glow",{scale:1,   opacity:0.6,duration:0.34,ease:"sine.inOut"},3.94);
      tl.to("#glow",{scale:1.12,opacity:1,duration:0.34,ease:"sine.inOut"},4.28);
      tl.to("#glow",{scale:1,   opacity:0.6,duration:0.34,ease:"sine.inOut"},4.62);
      tl.to("#glow",{scale:1.12,opacity:1,duration:0.34,ease:"sine.inOut"},4.96);

      // move to SUBSCRIBE, click 5.22 -> big boing, morph red->subscribed, bell ring, confetti, +1
      moveTo("#cursor",1604,732,4.55,0.5);
      clickdip("#cursor",5.22);
      boing("#subwrap",5.22);
      tl.to("#glow",{opacity:0,scale:1.4,duration:0.3,ease:"power1.out"},5.24);
      tl.set("#subRed",{opacity:0},5.32); tl.set("#subDone",{opacity:1},5.32);
      // bell ring
      tl.set("#subDone .bellic",{transformOrigin:"50% 18%"},5.32);
      tl.to("#subDone .bellic",{rotation:-22,duration:0.07},5.34);
      tl.to("#subDone .bellic",{rotation:22,duration:0.10},5.41);
      tl.to("#subDone .bellic",{rotation:-14,duration:0.10},5.51);
      tl.to("#subDone .bellic",{rotation:0,duration:0.12,ease:"sine.out"},5.61);
      // channel line flips to a warm welcome + "Thanks!" floats up (no fake subscriber count)
      tl.set("#subs1",{opacity:0},5.40); tl.set("#subs2",{opacity:1},5.40);
      tl.fromTo("#thanks",{opacity:0,y:0,scale:0.5},{opacity:1,y:-10,scale:1,duration:0.22,ease:"back.out(2)",immediateRender:false},5.30);
      tl.to("#thanks",{opacity:0,y:-70,duration:0.6,ease:"power1.out"},5.55);
      // confetti burst
      show("#confetti",0,5.22);
      const bx=[-260,-180,-90,40,150,250,-220,-120,30,170,260,-40];
      const by=[-230,-300,-260,-310,-270,-220,-150,-180,-310,-170,-150,-330];
      tl.fromTo("#confetti .cfp",
        {x:0,y:0,opacity:1,scale:1,rotation:0},
        {x:(i)=>bx[i], y:(i)=>by[i], rotation:(i)=>bx[i]*1.4, opacity:0, scale:0.4, duration:0.95, ease:"power2.out", immediateRender:false},
        5.24);

      // cursor drifts off after the subscribe
      moveTo("#cursor",1720,1010,5.80,0.6);
      fadeOut("#cursor",5.90,0.4);

      // ----- sign-off 6.66 -----
      fadeOut("#helped",6.30,0.3);
      tl.to("#witPoint",{opacity:0,duration:0.3},6.40);
      tl.to("#witPeace",{opacity:1,duration:0.3},6.40);
      show("#bye",0,6.66);
      show("#mark",0,6.66);

      window.__timelines["Section08Outro"] = tl;
    </script>
  </div>
</body>
</html>
