<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Short 01 - Is Any Of This Real?</title>
  <style>
    @font-face { font-family:"PatrickHandLocal"; src:url("./assets/fonts/patrick-hand-latin.woff2") format("woff2"); font-weight:400; font-style:normal; font-display:block; }
    :root { --ink:#14110d; --red:#e0392b; --green:#1db954; }
    * { box-sizing:border-box; }
    body { margin:0; background:#07070a; color:#fff; overflow:hidden; }
    #Short01 { position:relative; width:1080px; height:1920px; overflow:hidden; background:#07070a; font-family:"PatrickHandLocal"; }
    .scene { position:absolute; inset:0; width:100%; height:100%; z-index:1; }
    .photo { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .b-bright { filter:saturate(1.1) contrast(1.05) brightness(0.84); }
    .b-warm   { filter:saturate(1.12) contrast(1.05) brightness(0.86) hue-rotate(-4deg); }
    .b-cool   { filter:saturate(1.05) contrast(1.08) brightness(0.82) hue-rotate(6deg); }
    .b-dark   { filter:saturate(1.05) contrast(1.1) brightness(0.82); }
    .b-sludge { filter:saturate(0.72) contrast(1.1) brightness(0.5) hue-rotate(16deg); }
    /* top + bottom scrims for readability */
    .scrim-top { position:absolute; left:0; right:0; top:0; height:620px; z-index:2; background:linear-gradient(180deg, rgba(4,5,10,0.72) 0%, rgba(4,5,10,0.28) 60%, rgba(4,5,10,0) 100%); }
    .scrim-bot { position:absolute; left:0; right:0; bottom:0; height:520px; z-index:2; background:linear-gradient(0deg, rgba(4,5,10,0.66) 0%, rgba(4,5,10,0) 100%); }

    .wit { position:absolute; object-fit:contain; z-index:8; filter:drop-shadow(12px 14px 0 rgba(0,0,0,0.3)); transform-origin:center bottom; }

    /* handwritten labels (upper third) */
    .hand { position:absolute; z-index:9; font-family:"PatrickHandLocal"; color:#fff; text-shadow:3px 4px 0 rgba(0,0,0,0.6); line-height:1.04; }
    .h64 { font-size:64px; } .h80 { font-size:84px; } .qbig { font-size:104px; }

    /* chips / stamps / markup */
    .chip { position:absolute; z-index:9; font-family:"Segoe UI",system-ui,sans-serif; font-weight:800; font-size:42px; color:#fff; background:#0c0c12; border:3px solid #2aa3ff; border-radius:16px; padding:10px 24px; box-shadow:0 10px 26px rgba(0,0,0,0.5); white-space:nowrap; }
    .markup { position:absolute; z-index:11; font-family:"PatrickHandLocal"; color:var(--red); font-size:64px; transform:rotate(-7deg); text-shadow:1px 2px 0 rgba(0,0,0,0.45); white-space:nowrap; }

    /* big kinetic words */
    .bigword { position:absolute; z-index:10; font-family:"Segoe UI",system-ui,sans-serif; font-weight:900; letter-spacing:-1px; color:#fff; }
    .gword { font-size:200px; color:#ffd23f; text-shadow:-4px -4px 0 #1a140a, 4px -4px 0 #1a140a, -4px 4px 0 #1a140a, 4px 4px 0 #1a140a, 0 0 40px rgba(0,0,0,0.7), 8px 10px 0 rgba(0,0,0,0.5); }
    .mini { position:absolute; z-index:10; font-family:"Segoe UI",system-ui,sans-serif; font-weight:900; font-size:72px; color:#fff; text-shadow:-2px -2px 0 #141414, 2px -2px 0 #141414, -2px 2px 0 #141414, 2px 2px 0 #141414, 4px 6px 0 rgba(0,0,0,0.55); }

    /* phone "post" frame (shrimp) */
    .post { position:absolute; z-index:7; width:600px; background:#fff; border-radius:30px; box-shadow:0 22px 50px rgba(0,0,0,0.55); overflow:hidden; }
    .post .pimg { width:100%; height:460px; object-fit:cover; display:block; }
    .post .prow { display:flex; align-items:center; gap:14px; padding:16px 20px; font-family:"Segoe UI",system-ui,sans-serif; }
    .post .pdot { width:46px; height:46px; border-radius:50%; background:#d8dbe0; }
    .post .pbar { height:14px; width:160px; background:#e3e5ea; border-radius:8px; }
    .post .plike { margin-left:auto; font-weight:900; color:var(--red); font-size:32px; }

    /* news + band cards (pre-made assets) */
    .newscard { position:absolute; z-index:7; width:880px; filter:drop-shadow(0 22px 44px rgba(0,0,0,0.5)); }
    .bandcard { position:absolute; z-index:7; width:900px; clip-path:inset(30% 2% 33% 2%); filter:drop-shadow(0 22px 44px rgba(0,0,0,0.55)); }

    /* payoff hero card */
    .payoff-card { position:absolute; z-index:11; left:50%; transform:translateX(-50%); width:880px; text-align:center; background:rgba(12,10,7,0.86); border:5px solid #ffd23f; border-radius:26px; padding:26px 30px; box-shadow:0 18px 48px rgba(0,0,0,0.6); }
    .payoff-card .pc { font-family:"Segoe UI",system-ui,sans-serif; font-weight:900; font-size:78px; color:#ffd23f; letter-spacing:0.5px; text-shadow:3px 4px 0 rgba(0,0,0,0.5); }

    /* rising sludge overlay for payoff */
    .sludge { position:absolute; left:0; right:0; bottom:0; height:60%; z-index:6; background:linear-gradient(180deg, rgba(60,66,40,0) 0%, rgba(54,60,36,0.55) 34%, rgba(40,46,28,0.92) 78%); }
    .slopbit { position:absolute; z-index:7; object-fit:contain; opacity:0.92; border-radius:14px; filter:saturate(0.95) brightness(0.95) drop-shadow(0 8px 16px rgba(0,0,0,0.5)); transform:rotate(-5deg); }

    /* distinct centered SUBTITLE layer */
    .caption-layer { position:absolute; inset:0; z-index:20; pointer-events:none; }
    .cap { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:max-content; max-width:820px; text-align:center;
           font-family:"Segoe UI",system-ui,sans-serif; font-weight:800; font-size:60px; line-height:1.16; color:#fff;
           background:rgba(16,12,9,0.5); border-radius:22px; padding:14px 30px;
           text-shadow:-2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0 3px 10px rgba(0,0,0,0.6); }

    /* TEMP safe-guide (REMOVE before handoff) */
    .safe-guide { position:absolute; left:60px; top:220px; width:820px; height:1270px; z-index:90; border:4px dashed rgba(0,255,170,0.9); pointer-events:none; }
    .center-line { position:absolute; left:0; right:0; top:960px; height:3px; background:rgba(0,255,170,0.7); z-index:90; pointer-events:none; }

    .wit,.hand,.chip,.markup,.bigword,.mini,.post,.newscard,.bandcard,.payoff-card,.slopbit,.cap { will-change:opacity, transform; }
  </style>
</head>
<body>
  <div id="Short01" data-composition-id="Short01" data-start="0" data-duration="21.85" data-width="1080" data-height="1920">

    <!-- SCENE 1  0.00-3.72  "Pick up your phone... scroll for ten seconds." -->
    <div id="scene-1" class="scene clip" data-start="0" data-duration="3.72" data-track-index="1" data-layout-allow-overflow="" style="overflow:visible;">
      <img class="photo b-warm" src="./assets/couch-phone-evening-1.jpg" alt="">
      <div class="scrim-top"></div><div class="scrim-bot"></div>
      <div class="hand h80 s1-lbl" style="left:80px; top:250px; width:820px;">scroll for<br>10 seconds...</div>
      <img class="wit s1-wit" data-layout-allow-overflow="" style="right:-150px; bottom:-120px; width:980px;" src="./assets/poses/holding_phone_pointing_smile.png" alt="">
    </div>

    <!-- SCENE 2  3.72-7.10  "Now be honest: how much was made by a human?" -->
    <div id="scene-2" class="scene clip" data-start="3.72" data-duration="3.38" data-track-index="3" data-layout-allow-overflow="" style="overflow:visible;">
      <img class="photo b-dark" src="./assets/dark-room-phone-glow-1.jpg" alt="">
      <div class="scrim-top"></div><div class="scrim-bot"></div>
      <div class="chip s2-chip" style="left:50%; transform:translateX(-50%); top:300px;">% human?</div>
      <img class="wit s2-wit" data-layout-allow-overflow="" style="left:50%; transform:translateX(-50%); bottom:-150px; width:960px;" src="./assets/poses/skeptical_side_eye_doubtful.png" alt="">
    </div>

    <!-- SCENE 3  7.10-9.72  "a photo of a shrimp shaped like Jesus," -->
    <div id="scene-3" class="scene clip" data-start="7.10" data-duration="2.62" data-track-index="4" data-layout-allow-overflow="" style="overflow:visible;">
      <img class="photo b-bright" src="./assets/social-scroll-livingroom-1.jpg" alt="">
      <div class="scrim-top"></div><div class="scrim-bot"></div>
      <div class="post s3-post" style="left:50%; transform:translateX(-50%); top:250px;">
        <img class="pimg" src="./assets/shrimp-jesus.jpg" alt="">
        <div class="prow"><div class="pdot"></div><div class="pbar"></div><div class="plike">AMEN 47K</div></div>
      </div>
      <img class="wit s3-wit" data-layout-allow-overflow="" style="right:-170px; bottom:-150px; width:940px;" src="./assets/poses/cringe_uneasy_drool.png" alt="">
    </div>

    <!-- SCENE 4  9.72-11.66  "a news story about an event that never happened," -->
    <div id="scene-4" class="scene clip" data-start="9.72" data-duration="1.94" data-track-index="5" data-layout-allow-overflow="" style="overflow:visible;">
      <img class="photo b-cool" src="./assets/newsroom-blur-1.jpg" alt="">
      <div class="scrim-top"></div><div class="scrim-bot"></div>
      <img class="newscard s4-card" style="left:50%; transform:translateX(-50%); top:280px;" src="./assets/fake-news-card.png" alt="">
      <div class="markup s4-mark" style="left:50%; transform:translate(-50%,0); top:470px; font-size:72px;">DIDN'T HAPPEN</div>
      <img class="wit s4-wit" data-layout-allow-overflow="" style="left:-180px; bottom:-150px; width:940px;" src="./assets/poses/pondering_skeptical_hand_on_chin.png" alt="">
    </div>

    <!-- SCENE 5  11.66-14.10  "a hit song by a band that does not exist." -->
    <div id="scene-5" class="scene clip" data-start="11.66" data-duration="2.44" data-track-index="6" data-layout-allow-overflow="" style="overflow:visible;">
      <img class="photo b-dark" src="./assets/music-studio-blur-1.jpg" alt="">
      <div class="scrim-top"></div><div class="scrim-bot"></div>
      <img class="bandcard s5-card" style="left:50%; transform:translateX(-50%); top:330px;" src="./assets/fake-band-card.png" alt="">
      <div class="markup s5-mark" style="left:50%; transform:translate(-50%,0); top:560px; color:#ff5b6e;">0 REAL MEMBERS</div>
      <img class="wit s5-wit" data-layout-allow-overflow="" style="right:-170px; bottom:-150px; width:940px;" src="./assets/poses/mildly_surprised_hand_at_chin.png" alt="">
    </div>

    <!-- SCENE 6  14.10-21.85  payoff: "filling up with garbage... nobody told it to." -->
    <div id="scene-6" class="scene clip" data-start="14.10" data-duration="7.75" data-track-index="7" data-layout-allow-overflow="" style="overflow:visible;">
      <img class="photo b-sludge" src="./assets/grey-sludge-flood-1.jpg" alt="">
      <div class="sludge"></div>
      <img class="slopbit s6-slop1" style="left:70px; bottom:520px; width:240px;" src="./assets/shrimp-jesus.jpg" alt="">
      <img class="slopbit s6-slop2" style="right:90px; bottom:560px; width:210px;" src="./assets/ai-extra-fingers-hand.png" alt="">
      <div class="bigword gword s6-garbage" style="left:0; top:250px; width:1080px; text-align:center;">GARBAGE</div>
      <div class="mini s6-m1" style="left:90px; top:560px;">cheap.</div>
      <div class="mini s6-m2" style="left:440px; top:560px; color:#ffd23f;">fake.</div>
      <div class="mini s6-m3" style="left:90px; top:660px;">mass-produced.</div>
      <div class="payoff-card s6-nobody" style="top:820px;"><div class="pc">NOBODY TOLD<br>IT TO.</div></div>
      <img class="wit s6-wit" data-layout-allow-overflow="" style="left:50%; transform:translateX(-50%); bottom:-120px; width:900px;" src="./assets/poses/worried_uneasy_wide_eyes.png" alt="">
    </div>

    <!-- distinct centered subtitles -->
    <div class="caption-layer">
      <div class="cap c1">Pick up your phone.</div>
      <div class="cap c2">Scroll for ten seconds.</div>
      <div class="cap c3">Now be honest...</div>
      <div class="cap c4">how much is real?</div>
      <div class="cap c5">Somewhere in your feed:</div>
      <div class="cap c6">a shrimp. as Jesus.</div>
      <div class="cap c7">news that never happened.</div>
      <div class="cap c8">a band that isn't real.</div>
    </div>

    <audio id="voiceover-short-01" data-start="0" data-duration="21.85" data-track-index="30" data-volume="1" crossorigin="anonymous" src="./voiceover/short-01.mp3"></audio>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      // init all captions hidden (off-timeline so t=0 doesn't cancel)
      gsap.set(".caption-layer .cap", { opacity:0 });

      const tl = gsap.timeline({ paused:true, defaults:{ overwrite:"auto" } });
      const reveal = (t, hideAt, at, fv, tv={}) => { const r={}; if("x"in fv)r.x=0; if("y"in fv)r.y=0; if("scale"in fv)r.scale=1; if("opacity"in fv)r.opacity=1; tl.set(t,fv,hideAt); tl.to(t,{...r,...tv},at); };
      const show  = (t, hideAt, at) => { tl.set(t,{opacity:0},hideAt); tl.set(t,{opacity:1},at); };
      const smash = (t, hideAt, at, fv={y:22,scale:1.3,opacity:0}) => reveal(t,hideAt,at,fv,{duration:0.2,ease:"back.out(1.9)"});
      const pop   = (t, hideAt, at) => reveal(t,hideAt,at,{scale:0.4,opacity:0},{duration:0.22,ease:"back.out(2)"});
      const cap   = (sel, at, hideAt) => { tl.set(sel,{opacity:1}, Math.max(at,0.05)); tl.set(sel,{opacity:0}, hideAt); };
      const fadeIn = (sel, at) => tl.fromTo(sel,{opacity:0},{opacity:1,duration:0.22,ease:"sine.out",immediateRender:false}, at);

      // scene crossfades
      fadeIn("#scene-2",3.72); fadeIn("#scene-3",7.10); fadeIn("#scene-4",9.72); fadeIn("#scene-5",11.66); fadeIn("#scene-6",14.10);

      // S1 - WIT in; label on "scroll" (2.02)
      show("#scene-1 .s1-wit", 0, 0.30);
      smash("#scene-1 .s1-lbl", 0, 2.02, {y:20,scale:1.12,opacity:0});

      // S2 - WIT; "% human?" chip on "human?" (6.24)
      show("#scene-2 .s2-wit", 3.72, 3.86);
      pop("#scene-2 .s2-chip", 3.72, 6.24);

      // S3 - shrimp post on "shrimp" (8.56); WIT
      show("#scene-3 .s3-wit", 7.10, 7.30);
      pop("#scene-3 .s3-post", 7.10, 8.56);

      // S4 - news card on "new story" (9.80); red markup on "never happened" (11.18)
      show("#scene-4 .s4-wit", 9.72, 9.82);
      pop("#scene-4 .s4-card", 9.72, 9.92);
      smash("#scene-4 .s4-mark", 9.72, 11.18, {scale:1.5,opacity:0,rotation:-7});

      // S5 - band card on "hit song" (11.80); markup on "exist" (13.24)
      show("#scene-5 .s5-wit", 11.66, 11.80);
      pop("#scene-5 .s5-card", 11.66, 11.96);
      smash("#scene-5 .s5-mark", 11.66, 13.24, {scale:1.5,opacity:0,rotation:-7});

      // S6 payoff - GARBAGE on "garbage" (15.38); chips cheap/fake/mass (16.24/16.62/16.86); NOBODY on "nobody" (19.58)
      show("#scene-6 .s6-wit", 14.10, 14.30);
      show("#scene-6 .s6-slop1", 14.10, 14.60);
      show("#scene-6 .s6-slop2", 14.10, 14.80);
      smash("#scene-6 .s6-garbage", 14.10, 15.38, {y:30,scale:1.25,opacity:0});
      pop("#scene-6 .s6-m1", 14.10, 16.24);
      pop("#scene-6 .s6-m2", 14.10, 16.62);
      pop("#scene-6 .s6-m3", 14.10, 16.86);
      smash("#scene-6 .s6-nobody", 14.10, 19.58, {y:20,scale:1.12,opacity:0});

      // captions (cleared during payoff so cards carry it)
      cap(".c1", 0.05, 1.46);
      cap(".c2", 1.46, 3.72);
      cap(".c3", 3.72, 4.54);
      cap(".c4", 4.54, 6.86);
      cap(".c5", 6.86, 8.56);
      cap(".c6", 8.56, 9.72);
      cap(".c7", 9.72, 11.66);
      cap(".c8", 11.66, 14.10);

      window.__timelines["Short01"] = tl;
    </script>
  </div>
</body>
</html>
