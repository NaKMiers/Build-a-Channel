<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Section 02 Reframe Looking Busy vs Doing Work - Why Everyone Pretends To Be Busy</title>
  <style>
    @font-face { font-family: "PatrickHandLocal"; src: url("./assets/fonts/patrick-hand-latin.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: block; }
    :root { --ink:#1b1510; --red:#b9362c; --red-deep:#7d1714; --cream:#fff7d8; --green:#188038; --sale:#f0c63d; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #14110d; color: var(--ink); overflow: hidden; }
    #Section02Reframe { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #14110d; font-family: "PatrickHandLocal"; }
    .scene, .cue { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; }
    .scene { z-index: 1; will-change: opacity, transform, filter; }
    .cue { z-index: 5; pointer-events: none; }
    .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; user-select: none; pointer-events: none; }
    .photo.workplace { filter:saturate(1.03) contrast(1.04) brightness(0.82); }
    .photo.idea { filter:saturate(1.06) contrast(1.06) brightness(0.96); }
    .photo.typing { filter:saturate(1.04) contrast(1.03) brightness(0.8); }
    .scrim { position:absolute; inset:0; z-index:1; background:radial-gradient(ellipse 82% 82% at 50% 46%, rgba(8,10,16,0.20), rgba(8,10,16,0.58) 96%); }
    .scrim.dark { background:radial-gradient(ellipse 70% 70% at 50% 48%, rgba(8,10,16,0.10), rgba(8,10,16,0.55) 92%); }

    /* real-UI Google Meet grid (Scene C) */
    .meetcard { position:absolute; left:60px; top:120px; width:560px; background:#202124; border-radius:16px; overflow:hidden; z-index:3; box-shadow:0 22px 44px rgba(0,0,0,0.5); }
    .meetcard .mtop { height:62px; display:flex; align-items:center; gap:14px; padding:0 22px; background:#2d2e31; font-family:"Segoe UI",system-ui,sans-serif; color:#e8eaed; font-size:26px; }
    .meetcard .mtop img { width:38px; height:38px; }
    .mgrid { display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(2,1fr); gap:10px; padding:14px; }
    .mtile { height:120px; background:#3c4043; border-radius:10px; display:flex; align-items:center; justify-content:center; }
    .mtile .av { width:70px; height:70px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-family:"Segoe UI",system-ui,sans-serif; font-size:32px; font-weight:600; }
    .mtile.spk { box-shadow:inset 0 0 0 4px #8ab4f8; }

    /* shared overlays */
    .label { position:absolute; display:inline-flex; align-items:center; justify-content:center; min-height:62px; padding:12px 26px 16px; background:var(--cream); border:7px solid var(--ink); border-radius:7px; box-shadow:12px 14px 0 rgba(27,21,16,0.24); color:var(--ink); font-size:56px; line-height:0.95; text-align:center; transform:rotate(-2deg); z-index:8; }
    .label.small { font-size:40px; padding:10px 20px 14px; }
    .label.red { background:#fff5f1; color:var(--red-deep); border-color:var(--red-deep); }
    .label.green { background:#eafbe7; color:var(--green); border-color:var(--green); }
    .label.dark { background:rgba(20,18,24,0.86); color:#fff; border-color:#fff; }
    .stamp { position:absolute; z-index:9; padding:14px 30px 18px; color:var(--red-deep); border:9px solid var(--red-deep); background:#fff5f1; font-size:60px; line-height:0.88; transform:rotate(-9deg); text-align:center; }
    .red-circle { position:absolute; border:12px solid var(--red); border-radius:50%; z-index:8; transform:rotate(-8deg); }
    .wit { position:absolute; object-fit:contain; z-index:9; filter:drop-shadow(15px 18px 0 rgba(0,0,0,0.30)); transform-origin:center center; }
    .label, .stamp, .wit, .meetcard, .red-circle { will-change: opacity, transform; }
  </style>
</head>
<body>
  <div id="Section02Reframe" data-composition-id="Section02Reframe" data-start="0" data-duration="29.02" data-width="1920" data-height="1080">

    <!-- SCENE A: not lazy (modern office interior) 0-5.94 -->
    <div id="scene-a" class="clip scene" data-start="0" data-duration="5.94" data-track-index="1">
      <img class="photo workplace" src="./assets/visual-references/section-02-reframe-looking-busy-vs-doing-work/base-workplace.jpg" alt="">
      <div class="scrim"></div>
    </div>

    <!-- SCENE B: the look of work (bulb on black) 5.88-14.62 -->
    <div id="scene-b" class="clip scene" data-start="5.88" data-duration="8.74" data-track-index="3">
      <img class="photo idea" src="./assets/visual-references/section-02-reframe-looking-busy-vs-doing-work/base-idea.jpg" alt="">
      <div class="scrim dark"></div>
    </div>

    <!-- SCENE C: busy is easy to see (typing + Meet grid) 14.58-20.24 -->
    <div id="scene-c" class="clip scene" data-start="14.58" data-duration="5.66" data-track-index="4">
      <img class="photo typing" src="./assets/visual-references/section-02-reframe-looking-busy-vs-doing-work/base-typing.jpg" alt="">
      <div class="scrim"></div>
      <div class="meetcard">
        <div class="mtop"><img src="./assets/visual-references/section-02-reframe-looking-busy-vs-doing-work/icons/meet.png" alt="">Team meeting · 8 people</div>
        <div class="mgrid">
          <div class="mtile spk"><div class="av" style="background:#1a73e8;">AK</div></div>
          <div class="mtile"><div class="av" style="background:#9334e6;">PR</div></div>
          <div class="mtile"><div class="av" style="background:#e8710a;">SM</div></div>
          <div class="mtile"><div class="av" style="background:#188038;">MI</div></div>
          <div class="mtile"><div class="av" style="background:#d93025;">JO</div></div>
          <div class="mtile"><div class="av" style="background:#3c4043;">+3</div></div>
        </div>
      </div>
    </div>

    <!-- SCENE D: real work hides (bulb returns) 20.18-29.02 -->
    <div id="scene-d" class="clip scene" data-start="20.18" data-duration="8.84" data-track-index="5">
      <img class="photo idea" src="./assets/visual-references/section-02-reframe-looking-busy-vs-doing-work/base-idea-d.jpg" alt="">
      <div class="scrim dark"></div>
    </div>

    <!-- CUE A 0-5.84 : not lazy + WIT talking -->
    <div id="cue-a" class="clip cue" data-start="0" data-duration="5.84" data-track-index="2" data-layout-allow-overflow="" style="overflow: visible;">
      <div class="label ca-notlazy" style="left: 60px; top: 90px; width: 620px;">NOT LAZY PEOPLE</div>
      <div class="label small ca-prob" style="left: 70px; top: 300px; width: 600px;">(a different, smaller problem)</div>
      <img class="wit ca-wit" data-layout-allow-overflow="" style="right: -210px; bottom: -350px; width: 1340px;" src="./assets/wit/wit-pose-talking-front.png" alt="">
    </div>

    <!-- CUE B 5.88-14.54 : the look of work / thinking looks like nothing + WIT thinking -->
    <div id="cue-b" class="clip cue" data-start="5.88" data-duration="8.66" data-track-index="2" data-layout-allow-overflow="" style="overflow: visible;">
      <div class="label small dark cb-stranger" style="left: 60px; top: 80px; width: 520px;">SOMETHING STRANGER</div>
      <div class="label cb-look" style="left: 60px; top: 230px; width: 760px;">REWARDS THE LOOK<br>＞ THE WORK</div>
      <div class="label small red cb-nothing" style="left: 60px; bottom: 150px; width: 700px;">THINKING = LOOKS LIKE NOTHING</div>
      <img class="wit cb-wit" data-layout-allow-overflow="" style="right: -210px; bottom: -350px; width: 1300px;" src="./assets/wit/wit-pose-thinking.png" alt="">
    </div>

    <!-- CUE C 14.58-20.14 : easy to see labels + WIT typing (Meet grid in scene-c) -->
    <div id="cue-c" class="clip cue" data-start="14.58" data-duration="5.56" data-track-index="2" data-layout-allow-overflow="" style="overflow: visible;">
      <div class="label small cc-easy" style="left: 50%; top: 70px; width: 480px; transform: translateX(-50%) rotate(-2deg);">EASY TO SEE</div>
      <div class="label small cc-meet" style="left: 640px; top: 250px; width: 360px;">MEETINGS</div>
      <div class="label small cc-type" style="left: 640px; top: 400px; width: 360px;">TYPING</div>
      <div class="label small cc-face" style="left: 640px; top: 550px; width: 420px;">A SERIOUS FACE</div>
      <img class="wit cc-wit" data-layout-allow-overflow="" style="right: -210px; bottom: -350px; width: 1300px;" src="./assets/wit/wit-pose-typing-on-laptop.png" alt="">
    </div>

    <!-- CUE D 20.18-29.02 : trust / ignore / real work hides + WIT deadpan -->
    <div id="cue-d" class="clip cue" data-start="20.18" data-duration="8.84" data-track-index="2" data-layout-allow-overflow="" style="overflow: visible;">
      <div class="label small dark cd-trust" style="left: 60px; top: 80px; width: 620px;">WE TRUST WHAT WE SEE</div>
      <div class="label small red cd-ignore" style="left: 70px; top: 230px; width: 640px;">…IGNORE WHAT WE CAN'T</div>
      <div class="red-circle cd-circle" style="left: 760px; top: 300px; width: 420px; height: 480px;"></div>
      <div class="label green cd-hides" style="left: 60px; bottom: 140px; width: 660px;">REAL WORK HIDES HERE</div>
      <img class="wit cd-wit" data-layout-allow-overflow="" style="right: -230px; bottom: -350px; width: 1300px;" src="./assets/wit/wit-pose-deadpan-side-eye.png" alt="">
    </div>

    <audio id="voiceover-section-02" data-start="0" data-duration="29.02" data-track-index="10" data-volume="1" crossorigin="anonymous" src="./section-02-reframe-looking-busy-vs-doing-work-david23-am_eric-0.84.mp3"></audio>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true, defaults: { overwrite: "auto" } });
      const reveal = (t, hideAt, at, fv, tv = {}) => { const r = {}; if ("x" in fv) r.x = 0; if ("y" in fv) r.y = 0; if ("scale" in fv) r.scale = 1; if ("opacity" in fv) r.opacity = 1; tl.set(t, fv, hideAt); tl.to(t, { ...r, ...tv }, at); };
      const show = (t, hideAt, at) => { tl.set(t, { opacity: 0 }, hideAt); tl.set(t, { opacity: 1 }, at); };
      const smash = (t, hideAt, at, fv = { y: 20, scale: 1.3, opacity: 0 }) => reveal(t, hideAt, at, fv, { duration: 0.18, ease: "back.out(1.9)" });

      // Scene cross-fades
      tl.fromTo("#scene-b", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "sine.out", immediateRender: false }, 5.88);
      tl.fromTo("#scene-c", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "sine.out", immediateRender: false }, 14.58);
      tl.fromTo("#scene-d", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "sine.out", immediateRender: false }, 20.18);

      // SCENE A
      show("#cue-a .ca-wit", 0, 0.40);
      show("#cue-a .ca-notlazy", 0, 1.50);
      show("#cue-a .ca-prob", 0, 4.46);

      // SCENE B
      show("#cue-b .cb-wit", 5.88, 6.10);
      show("#cue-b .cb-stranger", 5.88, 5.98);
      smash("#cue-b .cb-look", 5.88, 7.72);
      show("#cue-b .cb-nothing", 5.88, 12.02);

      // SCENE C - busy is easy to see (Meet grid + staggered labels)
      show("#cue-c .cc-wit", 14.58, 14.80);
      show("#cue-c .cc-easy", 14.58, 14.80);
      smash("#scene-c .meetcard", 14.58, 16.06, { y: -20, opacity: 0 });
      smash("#cue-c .cc-meet", 14.58, 16.06, { x: 30, opacity: 0 });
      smash("#cue-c .cc-type", 14.58, 17.20, { x: 30, opacity: 0 });
      smash("#cue-c .cc-face", 14.58, 18.32, { x: 30, opacity: 0 });

      // SCENE D - real work hides
      show("#cue-d .cd-wit", 20.18, 20.40);
      show("#cue-d .cd-trust", 20.18, 20.40);
      show("#cue-d .cd-ignore", 20.18, 22.22);
      show("#cue-d .cd-circle", 20.18, 26.98);
      smash("#cue-d .cd-hides", 20.18, 27.10);

      window.__timelines["Section02Reframe"] = tl;
    </script>
  </div>
</body>
</html>
