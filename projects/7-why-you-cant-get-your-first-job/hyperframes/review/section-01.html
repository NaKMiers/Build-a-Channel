    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true, defaults: { overwrite: "auto" } });

      const reveal = (target, hideAt, at, fromVars, toVars = {}) => {
        const reset = {};
        if ("x" in fromVars) reset.x = 0;
        if ("y" in fromVars) reset.y = 0;
        if ("scale" in fromVars) reset.scale = 1;
        if ("opacity" in fromVars) reset.opacity = 1;
        tl.set(target, fromVars, hideAt + 0.02);
        tl.to(target, { ...reset, ...toVars }, at);
      };

      const show = (target, hideAt, at) => {
        tl.set(target, { opacity: 0 }, hideAt + 0.02);
        tl.set(target, { opacity: 1 }, at);
      };

      const smash = (target, hideAt, at, fromVars = { y: 22, scale: 1.3, opacity: 0 }) => {
        reveal(target, hideAt, at, fromVars, { duration: 0.20, ease: "back.out(1.9)" });
      };

      const pop = (target, hideAt, at) => {
        reveal(target, hideAt, at, { scale: 0.4, opacity: 0 }, { duration: 0.22, ease: "back.out(2)" });
      };

      /* Scene 1.1 - graduated@0.44. The whole pose gets one small paper-forward beat on just@0.20. */
      tl.to("#s1-wit", { x: 10, rotation: 1.2, duration: 0.14, ease: "power2.out" }, 0.20);
      tl.to("#s1-wit", { x: 0, rotation: 0, duration: 0.18, ease: "sine.out" }, 0.34);
      smash("#s1-stamp", 0, 0.44, { scale: 1.55, opacity: 0, rotation: -3 });

      /* Scene 1.2 - card on find@1.56, click on entry@2.02, role on job@2.42, GOOD on Good@3.90. */
      show("#s2-card", 1.36, 1.56);
      tl.set("#s2-cursor", { opacity: 0, x: 1030, y: 760 }, 1.38);
      tl.set("#s2-cursor", { opacity: 1 }, 1.56);
      tl.to("#s2-cursor", { x: 340, y: 160, duration: 0.46, ease: "power2.inOut" }, 1.56);
      tl.to("#s2-entry", { backgroundColor: "#0d6c72", color: "#ffffff", duration: 0.12, ease: "none" }, 2.02);
      tl.to("#s2-entry", { scale: 0.94, duration: 0.06, yoyo: true, repeat: 1, ease: "power1.inOut" }, 2.02);
      show("#s2-role", 1.36, 2.42);
      pop("#s2-good", 1.36, 3.90);

      /* Scene 1.3 - preserve the Studio-combined 3 YEARS card; EXPERIENCE@5.66, REQUIRED@6.08. */
      tl.set("#s3-years", { opacity: 1 }, 4.96);
      show("#s3-experience", 4.96, 5.66);
      show("#s3-required", 4.96, 6.08);
      tl.to("#s3-underline", { scaleX: 1, duration: 0.20, ease: "power2.out" }, 6.08);

      /* Scene 1.4 - EXPERIENCE pass@7.96 opens the JOB label@8.88; JOB pass@10.18 opens EXPERIENCE@10.72. */
      show("#s4-pass-exp", 7.62, 7.96);
      show("#s4-door-job", 7.62, 8.88);
      tl.set("#s4-pass-exp, #s4-door-job", { opacity: 0 }, 9.54);
      show("#s4-pass-job", 9.54, 10.18);
      show("#s4-door-exp", 9.54, 10.72);

      /* Scene 1.5 - ladder@13.62, bend from is@13.90, circle closes on circle@14.60. */
      const rungs = gsap.utils.toArray("#scene-5 .morph-rung");
      const straightY = [52, 165, 278, 391, 504, 617, 730, 843];
      const circleTargets = [
        { x: 820, y: 70, rotation: 90 },
        { x: 1096, y: 184, rotation: -45 },
        { x: 1210, y: 460, rotation: 0 },
        { x: 1096, y: 736, rotation: 45 },
        { x: 820, y: 850, rotation: 90 },
        { x: 544, y: 736, rotation: -45 },
        { x: 430, y: 460, rotation: 0 },
        { x: 544, y: 184, rotation: 45 }
      ];

      rungs.forEach((rung, index) => {
        tl.set(rung, { opacity: 0, x: 820, y: straightY[index], rotation: 0, scaleX: 3, scaleY: 0.5 }, 12.34);
        tl.set(rung, { opacity: 1 }, 13.62);
        tl.to(rung, { ...circleTargets[index], scaleX: 1, scaleY: 1, duration: 0.70, ease: "power2.inOut" }, 13.90);
      });

      show("#s5-straight-rails", 12.34, 13.62);
      show("#s5-career-label", 12.34, 13.62);
      tl.to("#s5-straight-rails", { opacity: 0, duration: 0.34, ease: "power1.in" }, 13.90);
      tl.to("#s5-outer-rail", { strokeDashoffset: 0, duration: 0.70, ease: "none" }, 13.90);
      tl.to("#s5-inner-rail", { strokeDashoffset: 0, duration: 0.70, ease: "none" }, 13.90);
      smash("#s5-circle-badge", 12.34, 14.60, { scale: 1.45, opacity: 0, rotation: -4 });

      /* Scene 1.6 remake - one clean promise board: four@16.18, you@16.78, your@17.38, how@18.40. */
      show("#s6-count", 15.84, 16.18);
      show("#s6-cant", 15.84, 16.78);
      show("#s6-first-job", 15.84, 17.38);
      show("#s6-route", 15.84, 18.40);

      window.__timelines["Section01LadderCircle"] = tl;
    </script>
