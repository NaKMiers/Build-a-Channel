  <style>

    .cue  { opacity:0; }

    .stampred { position:absolute; z-index:10; font-family:"PatrickHandLocal"; font-weight:400; font-size:96px; color:var(--red); border:7px solid var(--red); background:rgba(255,247,216,0.92); border-radius:14px; padding:6px 30px; transform:rotate(4deg); white-space:nowrap; box-shadow:0 10px 26px rgba(0,0,0,0.4); }

    /* confetti */
    .cfp { position:absolute; z-index:5; width:26px; height:11px; border-radius:3px; }

    /* glint star */
    .glint { position:absolute; z-index:11; width:74px; height:74px; }
    .glint i { position:absolute; left:50%; top:0; width:12px; height:74px; margin-left:-6px; background:#fff; border-radius:6px; box-shadow:0 0 18px rgba(255,240,190,0.9); }
    .glint i:last-child { transform:rotate(90deg); }

    /* price tag */
    .tagwrap { position:absolute; z-index:9; transform-origin:top center; }
    .tagstring { position:absolute; left:50%; top:-86px; width:5px; height:92px; margin-left:-2px; background:#d9cdaa; border-radius:3px; }
    .tagcard { width:470px; background:var(--cream); border:4px solid #2a2118; border-radius:14px; padding:22px 26px 18px; box-shadow:0 16px 34px rgba(0,0,0,0.55); text-align:center; }
    .tagcard .t1 { font-size:62px; color:var(--ink); }
    .tagcard .t2 { font-size:76px; color:var(--red); transform:rotate(-3deg); margin-top:4px; }

    /* receipt printing */
    .rwrap { position:absolute; z-index:7; transform-origin:top right; }
    .rwrap img { width:100%; display:block; filter:drop-shadow(0 10px 22px rgba(0,0,0,0.35)); }
    #s3-receipt { clip-path:inset(0 0 92% 0); }

    /* gag chips */
    .gag { position:absolute; z-index:10; display:flex; align-items:center; gap:16px; background:var(--cream); border:4px solid #2a2118; border-radius:16px; padding:14px 24px; box-shadow:0 12px 26px rgba(0,0,0,0.45); }
    .gag .glabel { font-family:"PatrickHandLocal"; font-size:44px; color:var(--ink); white-space:nowrap; }
    .gag svg { display:block; }

    /* podium under trophy (hides map fold seam) */
    .podium { position:absolute; z-index:5; background:linear-gradient(180deg,#4a3a2c,#2b2118); border-radius:10px; box-shadow:0 14px 30px rgba(0,0,0,0.5); }
    .podium.lip { border-radius:6px; }

    /* checklist card */
    .klist { position:absolute; z-index:9; width:610px; background:var(--cream); border:4px solid #2a2118; border-radius:18px; padding:28px 34px; box-shadow:0 16px 34px rgba(0,0,0,0.5); }
    .klist .khead { font-size:62px; color:var(--ink); border-bottom:5px solid var(--ink); padding-bottom:10px; margin-bottom:18px; }
    .klist .krow { display:flex; align-items:center; gap:20px; font-size:58px; color:var(--ink); padding:10px 0; }
    .klist .krow svg { flex:0 0 auto; }

    /* googly eyes */
    .geye { position:absolute; z-index:9; width:66px; height:66px; background:#fff; border:5px solid #17130e; border-radius:50%; }
    .geye i { position:absolute; left:17px; top:22px; width:22px; height:22px; background:#17130e; border-radius:50%; }

    /* strike / underline bars tied to text spans */
    .uspan { position:relative; display:inline-block; }
    .uspan .ub { position:absolute; left:0; width:100%; height:7px; background:var(--red); border-radius:4px; transform:scaleX(0); transform-origin:left center; }

    /* the bill arrow */
    .billarrow { position:absolute; z-index:10; }

    .wit,.hand,.stampred,.cfp,.glint,.tagwrap,.gag,.klist,.geye,.rwrap,.billarrow,.prop { will-change:opacity, transform; }
  </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused:true, defaults:{ overwrite:"auto" } });
      const reveal = (t, hideAt, at, fv, tv={}) => { const r={}; if("x"in fv)r.x=0; if("y"in fv)r.y=0; if("scale"in fv)r.scale=1; if("opacity"in fv)r.opacity=1; tl.set(t,fv,hideAt); tl.to(t,{...r,...tv},at); };
      const show  = (t, hideAt, at) => { tl.set(t,{opacity:0},hideAt); tl.set(t,{opacity:1},at); };
      const smash = (t, hideAt, at, fv={y:22,scale:1.3,opacity:0}) => reveal(t,hideAt,at,fv,{duration:0.2,ease:"back.out(1.9)"});
      const pop   = (t, hideAt, at) => reveal(t,hideAt,at,{scale:0.4,opacity:0},{duration:0.22,ease:"back.out(2)"});

      /* SCENE 1  base+WIT+trophy from 0 (cold open). Confetti drifts; WINNER on Cup@4.18; glint on trophy@4.74; burst on party@5.26 */

      smash("#scene-1 .s1-winner", 0, 4.18, { scale:1.6, opacity:0, rotation:4 });
      pop("#scene-1 .s1-glint", 0, 4.74);
      pop("#scene-1 .s1-b", 0, 5.26);

      /* SCENE 2  tag swings in on prize@6.72; WIT on chance@7.76; LOSE BILLIONS stamps on dollars@8.98 */
