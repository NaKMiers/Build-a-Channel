<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Short 01 - It's Not An Investment. It's A Ferrari.</title>
  <style>
    @font-face { font-family:"PatrickHandLocal"; src:url("./assets/fonts/patrick-hand-latin.woff2") format("woff2"); font-weight:400; font-style:normal; font-display:block; }
    :root { --ink:#14110d; --red:#e0392b; --green:#1db954; --gold:#ffce54; }
    * { box-sizing:border-box; }
    body { margin:0; background:#07070a; color:#fff; overflow:hidden; }
    #Short01 { position:relative; width:1080px; height:1920px; overflow:hidden; background:#07070a; font-family:"PatrickHandLocal"; }
    .scene { position:absolute; inset:0; width:100%; height:100%; z-index:1; }
    .photo { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .b-warm   { filter:saturate(1.12) contrast(1.05) brightness(0.82) hue-rotate(-4deg); }
    .b-cool   { filter:saturate(1.05) contrast(1.08) brightness(0.8) hue-rotate(6deg); }
    .b-dark   { filter:saturate(1.02) contrast(1.1) brightness(0.7); }
    .scrim-top { position:absolute; left:0; right:0; top:0; height:640px; z-index:2; background:linear-gradient(180deg, rgba(4,5,10,0.74) 0%, rgba(4,5,10,0.3) 60%, rgba(4,5,10,0) 100%); }
    .scrim-bot { position:absolute; left:0; right:0; bottom:0; height:540px; z-index:2; background:linear-gradient(0deg, rgba(4,5,10,0.68) 0%, rgba(4,5,10,0) 100%); }

    .wit { position:absolute; object-fit:contain; z-index:8; filter:drop-shadow(12px 14px 0 rgba(0,0,0,0.3)); transform-origin:center bottom; }

    .hand { position:absolute; z-index:9; font-family:"PatrickHandLocal"; color:#fff; text-shadow:3px 4px 0 rgba(0,0,0,0.6); line-height:1.04; }
    .h64 { font-size:64px; } .h80 { font-size:84px; }

    .chip { position:absolute; z-index:9; font-family:"Segoe UI",system-ui,sans-serif; font-weight:800; font-size:40px; color:#fff; background:#0c0c12; border:3px solid var(--gold); border-radius:16px; padding:10px 24px; box-shadow:0 10px 26px rgba(0,0,0,0.5); white-space:nowrap; }
    .stamp { position:absolute; z-index:11; font-family:"Segoe UI",system-ui,sans-serif; font-weight:900; font-size:76px; color:#fff; border:7px solid var(--gold); border-radius:14px; padding:6px 26px; transform:rotate(-8deg); background:rgba(12,10,7,0.55); text-shadow:2px 3px 0 rgba(0,0,0,0.5); white-space:nowrap; }
    .markup { position:absolute; z-index:11; font-family:"PatrickHandLocal"; color:var(--red); font-size:72px; transform:rotate(-7deg); text-shadow:1px 2px 0 rgba(0,0,0,0.45); white-space:nowrap; }
    .strike { position:absolute; z-index:12; height:12px; background:var(--red); border-radius:8px; transform:rotate(-6deg); box-shadow:0 2px 6px rgba(0,0,0,0.4); }

    .bigword { position:absolute; z-index:10; font-family:"Segoe UI",system-ui,sans-serif; font-weight:900; letter-spacing:-1px; color:var(--gold); text-align:center; text-shadow:-4px -4px 0 #1a140a, 4px -4px 0 #1a140a, -4px 4px 0 #1a140a, 4px 4px 0 #1a140a, 0 0 40px rgba(0,0,0,0.7), 8px 10px 0 rgba(0,0,0,0.5); }

    .prop { position:absolute; object-fit:contain; z-index:7; filter:drop-shadow(0 20px 40px rgba(0,0,0,0.55)); }

    .payoff-card { position:absolute; z-index:12; left:50%; transform:translateX(-50%); width:820px; text-align:center; background:rgba(12,10,7,0.9); border:6px solid var(--red); border-radius:26px; padding:30px 30px; box-shadow:0 18px 48px rgba(0,0,0,0.6); }
    .payoff-card .pc { font-family:"Segoe UI",system-ui,sans-serif; font-weight:900; font-size:120px; color:#fff; letter-spacing:0.5px; text-shadow:3px 4px 0 rgba(0,0,0,0.5); }
    .payoff-card .pc small { display:block; font-size:44px; color:var(--gold); letter-spacing:1px; margin-top:6px; }

    .caption-layer { position:absolute; inset:0; z-index:20; pointer-events:none; }
    .cap { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:max-content; max-width:820px; text-align:center;
           font-family:"Segoe UI",system-ui,sans-serif; font-weight:800; font-size:60px; line-height:1.16; color:#fff;
           background:rgba(16,12,9,0.5); border-radius:22px; padding:14px 30px;
           text-shadow:-2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0 3px 10px rgba(0,0,0,0.6); }

    .wit,.hand,.chip,.stamp,.markup,.strike,.bigword,.prop,.payoff-card,.cap { will-change:opacity, transform; }
  </style>
</head>
<body>
  <div id="Short01" data-composition-id="Short01" data-start="0" data-duration="22.3" data-width="1080" data-height="1920">

    <!-- SCENE 1  0.00-3.38  "not an investment. It is a purchase." -->
    <div id="scene-1" class="scene clip" data-start="0" data-duration="3.38" data-track-index="1" data-layout-allow-overflow="" style="overflow:visible;">
      <img class="photo b-dark" src="./assets/desk-darkwood-1.jpg" alt="">
      <div class="scrim-top"></div><div class="scrim-bot"></div>
      <div class="hand h80 s1-inv" style="left:80px; top:280px; width:720px;">an "investment"?</div>
      <div class="strike s1-strike" style="left:90px; top:340px; width:520px;"></div>
      <div class="stamp s1-buy" style="left:120px; top:430px;">A PURCHASE</div>
      <img class="wit s1-wit" data-layout-allow-overflow="" style="right:-150px; bottom:-130px; width:900px;" src="./assets/poses/skeptical_side_eye_doubtful.png" alt="">
    </div>

    <!-- SCENE 2  3.38-9.32  "Nobody buys a Ferrari... to be SEEN... Countries do the same." -->
    <div id="scene-2" class="scene clip" data-start="3.38" data-duration="5.94" data-track-index="3" data-layout-allow-overflow="" style="overflow:visible;">
      <img class="photo b-warm" src="./assets/showroom-floor-1.jpg" alt="">
      <div class="scrim-top"></div><div class="scrim-bot"></div>
      <img class="prop s2-car" data-layout-allow-overflow="" style="left:50%; transform:translateX(-50%); top:360px; width:760px;" src="./assets/red-supercar-generic.png" alt="">
      <img class="prop s2-tag" style="right:120px; top:300px; width:230px;" src="./assets/price-tag-blank.png" alt="">
      <div class="hand h64 s2-tagtext" style="right:150px; top:360px; width:180px; color:#14110d; text-shadow:none; transform:rotate(-8deg);">PRESTIGE</div>
      <div class="stamp s2-seen" style="left:50%; transform:translate(-50%,0) rotate(-6deg); top:250px; border-color:var(--red);">to be SEEN</div>
      <img class="wit s2-wit" data-layout-allow-overflow="" style="left:-150px; bottom:-130px; width:860px;" src="./assets/poses/boss_suit_sunglasses_sparkle.png" alt="">
    </div>

    <!-- SCENE 3  9.32-16.30  "the price is billions... the credit card is yours. The taxpayer's." -->
    <div id="scene-3" class="scene clip" data-start="9.32" data-duration="6.98" data-track-index="4" data-layout-allow-overflow="" style="overflow:visible;">
      <img class="photo b-cool" src="./assets/marble-counter-1.jpg" alt="">
      <div class="scrim-top"></div><div class="scrim-bot"></div>
      <div class="bigword s3-billions" style="left:0; top:270px; width:1080px; font-size:150px;">BILLIONS</div>
      <img class="prop s3-card" data-layout-allow-overflow="" style="left:50%; transform:translateX(-50%) rotate(-5deg); top:470px; width:560px;" src="./assets/credit-card-taxpayer.png" alt="">
      <div class="markup s3-yours" style="left:50%; transform:translate(-50%,0) rotate(-6deg); top:770px; color:var(--red); font-size:64px;">...and it's YOURS</div>
      <img class="wit s3-wit" data-layout-allow-overflow="" style="right:-170px; bottom:-140px; width:840px;" src="./assets/poses/panic_hands_on_cheeks_scream.png" alt="">
    </div>

    <!-- SCENE 4  16.30-22.30  payoff: "the real question is never will it pay off. It is who pays." -->
    <div id="scene-4" class="scene clip" data-start="16.30" data-duration="6.0" data-track-index="5" data-layout-allow-overflow="" style="overflow:visible;">
      <img class="photo b-dark" src="./assets/desk-darkwood-1.jpg" alt="">
      <div class="scrim-top"></div><div class="scrim-bot"></div>
      <div class="hand h64 s4-not" style="left:80px; top:300px; width:820px; color:#e9e2d4;">not "will it pay off?"</div>
      <div class="payoff-card s4-pay" style="top:470px;"><div class="pc">WHO PAYS?<small>the real question</small></div></div>
      <img class="wit s4-wit" data-layout-allow-overflow="" style="left:50%; transform:translateX(-50%); bottom:-140px; width:820px;" src="./assets/poses/lecturing_finger_raised_eyes_closed.png" alt="">
    </div>

    <!-- distinct centered subtitles -->
    <div class="caption-layer">
      <div class="cap c1">Not an investment.</div>
      <div class="cap c2">It's a purchase.</div>
      <div class="cap c3">Nobody buys a Ferrari</div>
      <div class="cap c4">to be SEEN in one.</div>
      <div class="cap c5">Countries do the same.</div>
      <div class="cap c6">The price is billions.</div>
      <div class="cap c7">The card is yours.</div>
      <div class="cap c8">So the real question isn't...</div>
    </div>

    <audio id="voiceover-short-01" data-start="0" data-duration="22.3" data-track-index="30" data-volume="1" crossorigin="anonymous" src="./voiceover/short-01.mp3"></audio>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      gsap.set(".caption-layer .cap", { opacity:0 });

      const tl = gsap.timeline({ paused:true, defaults:{ overwrite:"auto" } });
      const reveal = (t, hideAt, at, fv, tv={}) => { const r={}; if("x"in fv)r.x=0; if("y"in fv)r.y=0; if("scale"in fv)r.scale=1; if("opacity"in fv)r.opacity=1; tl.set(t,fv,hideAt); tl.to(t,{...r,...tv},at); };
      const show  = (t, hideAt, at) => { tl.set(t,{opacity:0},hideAt); tl.set(t,{opacity:1},at); };
      const smash = (t, hideAt, at, fv={y:22,scale:1.3,opacity:0}) => reveal(t,hideAt,at,fv,{duration:0.2,ease:"back.out(1.9)"});
      const pop   = (t, hideAt, at) => reveal(t,hideAt,at,{scale:0.4,opacity:0},{duration:0.22,ease:"back.out(2)"});
      const cap   = (sel, at, hideAt) => { tl.set(sel,{opacity:1}, Math.max(at,0.05)); tl.set(sel,{opacity:0}, hideAt); };
      const fadeIn = (sel, at) => tl.fromTo(sel,{opacity:0},{opacity:1,duration:0.24,ease:"sine.out",immediateRender:false}, at);

      // scene crossfades
      fadeIn("#scene-2",3.38); fadeIn("#scene-3",9.32); fadeIn("#scene-4",16.30);

      // S1
      show("#scene-1 .s1-wit", 0, 0.20);
      show("#scene-1 .s1-inv", 0, 0.30);
      smash("#scene-1 .s1-strike", 0, 1.10, {scaleX:0,opacity:0,transformOrigin:"left center"});
      smash("#scene-1 .s1-buy", 0, 2.20, {y:18,scale:1.2,opacity:0});

      // S2 - car + WIT flex; "to be SEEN" on cue4 (5.38); tag
      show("#scene-2 .s2-wit", 3.38, 3.52);
      pop("#scene-2 .s2-car", 3.38, 3.70);
      pop("#scene-2 .s2-tag", 3.38, 4.20);
      show("#scene-2 .s2-tagtext", 3.38, 4.30);
      smash("#scene-2 .s2-seen", 3.38, 5.70, {scale:1.4,opacity:0,rotation:-6});

      // S3 - BILLIONS on cue6 (9.32); card on "credit card" (~13.5); markup on "yours" (~14.3)
      show("#scene-3 .s3-wit", 9.32, 9.46);
      smash("#scene-3 .s3-billions", 9.32, 9.70, {y:30,scale:1.25,opacity:0});
      pop("#scene-3 .s3-card", 9.32, 13.50);
      smash("#scene-3 .s3-yours", 9.32, 14.30, {scale:1.4,opacity:0,rotation:-6});

      // S4 payoff - "not will it pay off" label (16.5); WHO PAYS card on "who pays" (19.5)
      show("#scene-4 .s4-wit", 16.30, 16.44);
      show("#scene-4 .s4-not", 16.30, 16.60);
      smash("#scene-4 .s4-pay", 16.30, 19.50, {y:22,scale:1.15,opacity:0});

      // captions (cleared before the WHO PAYS card)
      cap(".c1", 0.05, 2.10);
      cap(".c2", 2.10, 3.38);
      cap(".c3", 3.38, 5.38);
      cap(".c4", 5.38, 8.02);
      cap(".c5", 8.02, 9.32);
      cap(".c6", 9.32, 13.38);
      cap(".c7", 13.38, 16.30);
      cap(".c8", 16.30, 19.38);

      window.__timelines["Short01"] = tl;
    </script>
  </div>
</body>
</html>
