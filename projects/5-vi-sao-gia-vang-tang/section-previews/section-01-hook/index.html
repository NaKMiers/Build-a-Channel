<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Section 01 - Hook (Gold)</title>
  <style>
    :root { --ink:#1a160f; --red:#e0392b; --gold:#f2b705; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #ffffff; color: var(--ink); overflow: hidden; }
    #Section01Hook { position: relative; width: 1920px; height: 1080px; overflow: hidden;
      background: #ffffff; font-family: "Segoe UI", system-ui, "Arial", sans-serif; }
    .scene, .cue { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; }
    .scene { z-index: 1; will-change: opacity; background:#ffffff; }
    .cue { z-index: 5; pointer-events: none; }
    .horizon { position:absolute; left:0; right:0; top:88%; height:2px; background:#d9d9d9; z-index:2; }

    .photo-cover { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    .photo-cover.chart { object-fit: contain; background:#fff; }
    .float-photo { position:absolute; object-fit:cover; border-radius:14px;
      box-shadow:0 18px 40px rgba(0,0,0,0.30); }
    .wit { position:absolute; object-fit:contain; z-index:8;
      filter:drop-shadow(12px 16px 0 rgba(0,0,0,0.18)); }

    .lbl { position:absolute; z-index:9; font-weight:800; font-size:60px; color:var(--ink);
      text-shadow:2px 3px 0 rgba(0,0,0,0.08); }
    .lbl.strike { color:var(--red); text-decoration:line-through; text-decoration-thickness:5px; }
    .lbl.white { color:#fff; text-shadow:0 0 18px rgba(0,0,0,0.6), 3px 4px 0 rgba(0,0,0,0.55); }
    .tag { position:absolute; z-index:10; background:var(--red); color:#fff; font-weight:900;
      font-size:46px; padding:12px 24px; border-radius:14px; box-shadow:0 14px 30px rgba(0,0,0,0.4); }
    .quote { position:absolute; z-index:10; font-weight:900; font-size:64px; color:#fff;
      text-shadow:0 0 20px rgba(0,0,0,0.7), 3px 4px 0 rgba(0,0,0,0.55); }
    .scrawl { position:absolute; z-index:11; color:var(--red); font-weight:900; font-size:88px;
      transform:rotate(-7deg); text-shadow:3px 4px 0 rgba(0,0,0,0.25); }
    .qmark { position:absolute; z-index:10; color:var(--gold); font-weight:900; font-size:240px;
      line-height:0.8; text-shadow:5px 6px 0 rgba(0,0,0,0.18); }
    .q { position:absolute; z-index:9; font-weight:800; font-size:48px; color:var(--ink);
      max-width:560px; text-shadow:2px 3px 0 rgba(0,0,0,0.08); }
    .title { position:absolute; z-index:10; font-weight:900; font-size:66px; color:var(--ink); text-align:center;
      width:1200px; left:360px; }
    .title .sub { display:block; font-size:40px; color:var(--red); margin-top:8px; }
    .lbl,.tag,.quote,.scrawl,.qmark,.q,.title,.wit,.float-photo { will-change: opacity, transform; }
  </style>
</head>
<body>
  <div id="Section01Hook" data-composition-id="Section01Hook" data-start="0" data-duration="29.352" data-width="1920" data-height="1080">

    <div class="horizon"></div>

    <!-- SCENE 1: white + gold bar object  0-7 -->
    <div id="scene-1" class="clip scene" data-start="0" data-duration="7" data-track-index="1">
      <img class="float-photo" src="./assets/gold-bar-on-table.jpg" alt="" style="left:140px; top:300px; width:560px; height:380px;">
    </div>
    <!-- SCENE 2: crowd photo  7-12 -->
    <div id="scene-2" class="clip scene" data-start="7" data-duration="5" data-track-index="3">
      <img class="photo-cover" src="./assets/gold-shop-crowd.png" alt="">
    </div>
    <!-- SCENE 3: rising chart  12-21 -->
    <div id="scene-3" class="clip scene" data-start="12" data-duration="9" data-track-index="4">
      <img class="photo-cover chart" src="./assets/gold-price-chart-rising.png" alt="">
    </div>
    <!-- SCENE 4: white (gold bar reused in cue)  21-27 -->
    <div id="scene-4" class="clip scene" data-start="21" data-duration="6" data-track-index="5"></div>
    <!-- SCENE 5: white focus  27-29.352 -->
    <div id="scene-5" class="clip scene" data-start="27" data-duration="2.352" data-track-index="6"></div>

    <!-- CUE 1  0-6.98 : "gold does nothing" + deadpan mascot -->
    <div id="cue-1" class="clip cue" data-start="0" data-duration="6.98" data-track-index="2">
      <div class="lbl strike c1a" style="left:130px; top:150px;">không trả lãi</div>
      <div class="lbl strike c1b" style="left:130px; top:250px;">không trả cổ tức</div>
      <div class="lbl strike c1c" style="left:130px; top:350px;">không nhắn tin chúc ngủ ngon</div>
      <img class="wit c1w" src="./assets/pose_deadpan_unimpressed_half_lidded.png" alt="" style="right:70px; bottom:0; width:560px;">
    </div>

    <!-- CUE 2  7-11.98 : crowd rush -->
    <div id="cue-2" class="clip cue" data-start="7" data-duration="4.98" data-track-index="2">
      <div class="lbl white c2a" style="left:120px; top:110px;">cả nước lao đi mua</div>
      <div class="tag c2b" style="right:120px; top:130px;">sắp hết hàng?!</div>
      <img class="wit c2w" src="./assets/pose_excited_giddy_fists_at_face.png" alt="" style="left:660px; bottom:0; width:640px;">
    </div>

    <!-- CUE 3  12-20.98 : "safe haven" + hug-gold at peak -->
    <div id="cue-3" class="clip cue" data-start="12" data-duration="8.98" data-track-index="2">
      <div class="quote c3a" style="left:120px; top:120px;">"nơi trú ẩn an toàn"</div>
      <div class="scrawl c3b" style="left:150px; top:250px;">an toàn?</div>
      <img class="wit c3w" src="./assets/pose_hugging_gold_bar_eyes_gold.png" alt="" style="right:120px; top:120px; width:680px;">
    </div>

    <!-- CUE 4  21-26.98 : two questions -->
    <div id="cue-4" class="clip cue" data-start="21" data-duration="5.98" data-track-index="2">
      <img class="float-photo c4bar" src="./assets/gold-bar-on-table.jpg" alt="" style="left:90px; top:430px; width:360px; height:250px;">
      <div class="qmark c4q" style="left:300px; top:300px;">?</div>
      <img class="c4brain" src="./assets/gold-glowing-brain.png" alt="" style="position:absolute; z-index:9; right:230px; top:200px; width:300px;">
      <div class="q c4q1" style="left:60px; top:120px;">cục kim loại chẳng làm gì… mà tăng điên cuồng?</div>
      <div class="q c4q2" style="right:60px; top:120px; text-align:right;">sao não cứ đòi mua khi càng đắt?</div>
      <img class="wit c4w" src="./assets/pose_pondering_skeptical_hand_on_chin.png" alt="" style="left:760px; bottom:0; width:520px;">
    </div>

    <!-- CUE 5  27-29.352 : mascot-only focus + title -->
    <div id="cue-5" class="clip cue" data-start="27" data-duration="2.352" data-track-index="2">
      <img class="wit c5w" src="./assets/pose_deadpan_unimpressed_half_lidded.png" alt="" style="left:660px; bottom:0; width:600px;">
      <div class="title c5t" style="top:170px;">Vì sao giá vàng tăng điên cuồng?<span class="sub">- mình mổ xẻ -</span></div>
      <img class="c5s" src="./assets/doodle-scalpel.png" alt="" style="position:absolute; z-index:11; left:1180px; top:150px; width:170px;">
    </div>

    <audio id="vo-s01" data-start="0" data-duration="29.352" data-track-index="10" data-volume="1" crossorigin="anonymous" src="./section-01-hook-nam-minh.mp3"></audio>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true, defaults: { overwrite: "auto" } });
      const show = (t, hideAt, at) => { tl.set(t, { opacity: 0 }, hideAt); tl.set(t, { opacity: 1 }, at); };
      const pop = (t, hideAt, at) => { tl.set(t, { opacity: 0, scale: 0.5 }, hideAt); tl.to(t, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(2)" }, at); };

      // scene cross-fades on cut
      tl.fromTo("#scene-2", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "sine.out", immediateRender: false }, 7);
      tl.fromTo("#scene-3", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "sine.out", immediateRender: false }, 12);
      tl.fromTo("#scene-4", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "sine.out", immediateRender: false }, 21);
      tl.fromTo("#scene-5", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "sine.out", immediateRender: false }, 27);

      // CUE 1 - gold does nothing (3 struck labels, deadpan mascot)
      show("#cue-1 .c1w", 0, 0.5);
      pop("#cue-1 .c1a", 0, 1.2);
      pop("#cue-1 .c1b", 0, 2.6);
      pop("#cue-1 .c1c", 0, 4.0);

      // CUE 2 - crowd rush
      show("#cue-2 .c2w", 7, 7.4);
      show("#cue-2 .c2a", 7, 7.7);
      pop("#cue-2 .c2b", 7, 10.0);

      // CUE 3 - safe haven, hug gold at peak
      show("#cue-3 .c3a", 12, 13.0);     // "nơi trú ẩn an toàn"
      show("#cue-3 .c3w", 12, 16.8);     // "giành nhau mua đúng lúc đắt nhất"
      pop("#cue-3 .c3b", 12, 17.4);      // "an toàn?"

      // CUE 4 - two questions
      show("#cue-4 .c4w", 21, 21.2);
      show("#cue-4 .c4bar", 21, 21.4);
      pop("#cue-4 .c4q", 21, 21.7);
      show("#cue-4 .c4q1", 21, 21.9);    // question 1
      pop("#cue-4 .c4brain", 21, 24.3);  // question 2 (brain)
      show("#cue-4 .c4q2", 21, 24.6);

      // CUE 5 - focus + title
      show("#cue-5 .c5w", 27, 27.1);
      show("#cue-5 .c5t", 27, 28.1);
      pop("#cue-5 .c5s", 27, 28.3);

      window.__timelines["Section01Hook"] = tl;
    </script>
  </div>
</body>
</html>
