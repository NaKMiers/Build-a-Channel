<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Section 05 More Features, More Tiny Deaths - Why Cheap Products Keep Getting Worse</title>
  <style>
    @font-face {
      font-family: "PatrickHandLocal";
      src: url("./assets/fonts/patrick-hand-latin.woff2") format("woff2");
      font-weight: 400; font-style: normal; font-display: block;
    }
    :root {
      --paper: #f2eadb; --cream: #fff8df; --ink: #17120f; --red: #7d1714;
      --red-soft: #fff1ea; --yellow: #efc63d; --green: #81b989;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); overflow: hidden; }
    #Section05MoreFeaturesMoreTinyDeaths {
      position: relative; width: 1920px; height: 1080px; overflow: hidden;
      background: var(--paper); font-family: "PatrickHandLocal";
    }
    .scene, .cue { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; }
    .scene { z-index: 1; background: var(--paper); }
    .cue { z-index: 5; pointer-events: none; }
    .photo-base { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; user-select: none; pointer-events: none; }
    .fridge-photo { object-position: center center; }
    .circuit-photo { object-position: center center; }

    /* hide a small visible appliance brand mark on the fridge door */
    .brand-mask { position: absolute; z-index: 3; border-radius: 6px; background: #cdd2d4; box-shadow: 0 0 10px rgba(205,210,212,0.6); pointer-events: none; }

    .label {
      position: absolute; display: inline-flex; align-items: center; justify-content: center;
      min-width: 140px; min-height: 66px; padding: 13px 24px 17px;
      background: var(--cream); border: 7px solid var(--ink); border-radius: 8px;
      box-shadow: 11px 13px 0 rgba(23,18,15,0.20); color: var(--ink);
      font-size: 76px; line-height: 0.9; text-align: center; letter-spacing: -0.01em;
      transform: rotate(-2deg); z-index: 8;
    }
    .label.small { min-height: 50px; padding: 11px 22px 15px; border-width: 5px; font-size: 58px; line-height: 0.94; box-shadow: 7px 9px 0 rgba(23,18,15,0.17); }
    .label.dark { background: #000; border-color: #fff; color: #fff; }
    .label.yellow { background: var(--yellow); color: #17120f; }
    .label.red { background: var(--red-soft); border-color: var(--red); color: #230403; }
    .label.green { background: #e8f4df; border-color: #21502c; color: #142418; }

    /* small scattered "feature pile" tags */
    .feat {
      position: absolute; padding: 11px 22px 15px; border: 5px solid var(--ink); border-radius: 10px;
      background: rgba(255,253,245,0.97); color: var(--ink); font-size: 56px; line-height: 0.9;
      box-shadow: 7px 9px 0 rgba(23,18,15,0.16); z-index: 9;
    }
    .feat.op { background: var(--red-soft); border-color: var(--red); color: #230403; }

    .payoff {
      position: absolute; left: 130px; top: 800px; width: 1240px; padding: 20px 32px 28px;
      border: 10px solid var(--red); background: var(--red-soft); box-shadow: 14px 16px 0 rgba(125,23,20,0.14);
      color: #230403; font-size: 72px; line-height: 0.86; text-align: center; transform: rotate(-2deg); z-index: 12;
    }
    .payoff > span { display: inline-block; white-space: nowrap; border-bottom: 9px solid var(--red); padding-bottom: 10px; }

    .wit { position: absolute; object-fit: contain; z-index: 10; filter: drop-shadow(13px 17px 0 rgba(23,18,15,0.18)); }
    .label > span, .feat > span, .payoff > span { display: inline-block; }
  </style>
</head>
<body>
  <div id="Section05MoreFeaturesMoreTinyDeaths" data-composition-id="Section05MoreFeaturesMoreTinyDeaths" data-start="0" data-duration="34.704" data-width="1920" data-height="1080">

    <!-- scenes (track 1): fridge persists 0-29.52 (simple -> committee), then circuit board -->
    <div id="scene-appliance" class="clip scene" data-start="0" data-duration="29.52" data-track-index="1">
      <img class="photo-base fridge-photo" src="./assets/section-05/fridge.jpg" alt="">
    </div>
    <div id="scene-circuit" class="clip scene" data-start="29.52" data-duration="5.184" data-track-index="1">
      <img class="photo-base circuit-photo" src="./assets/section-05/circuit-board.jpg" alt="">
    </div>

    <!-- cues (track 2), pinned to section-05-word-timings.json -->
    <div id="cue-intro" class="clip cue" data-layout-allow-overflow="" style="overflow: visible;" data-start="0" data-duration="3.04" data-track-index="2">
      <div class="label yellow" style="left: 130px; top: 90px; width: 740px;"><span>2ND REASON: MORE FEATURES</span></div>

    <div id="cue-good-features" class="clip cue" data-layout-allow-overflow="" style="overflow: visible;" data-start="3.04" data-duration="8.82" data-track-index="2">

      <div class="feat" style="left: 130px; top: 236px;"><span>SAFER</span></div>
      <div class="feat reveal-battery" style="left: 130px; top: 360px;"><span>BETTER BATTERY</span></div>
      <div class="feat reveal-phone" style="left: 130px; top: 484px;"><span>TOUGHER PHONE</span></div>
      <img class="wit" data-layout-allow-overflow="" style="right: -160px; bottom: -300px; width: 1040px;" src="./assets/wit/wit-pose-awkward-celebration.png" alt="">
    </div>

    <div id="cue-turn" class="clip cue" data-start="11.86" data-duration="3.18" data-track-index="2">
      <div class="label red" style="left: 130px; top: 150px; width: 980px;"><span>EVERY FEATURE = ONE MORE THING TO BREAK</span></div>
    </div>

    <div id="cue-pile-committee" class="clip cue" data-layout-allow-overflow="" style="overflow: visible;" data-start="15.04" data-duration="14.48" data-track-index="2">
      <div class="label" style="left: 120px; top: 84px; width: 470px;"><span>ONE JOB: BE COLD :)</span></div>
      <div class="feat reveal-screens" style="left: 120px; top: 250px;"><span>SCREENS</span></div>

      <div class="feat reveal-water" style="left: 150px; top: 380px; transform: rotate(-3deg);"><span>WATER LINES</span></div>
      <div class="feat reveal-ice" style="left: 520px; top: 372px; transform: rotate(2deg);"><span>ICE DISPENSER</span></div>
      <div class="feat reveal-software" style="left: 170px; top: 512px; transform: rotate(2deg);"><span>SOFTWARE</span></div>
      <div class="feat op reveal-opinions" style="left: 520px; top: 510px; transform: rotate(-3deg);"><span>+ OPINIONS</span></div>
      <div class="label yellow reveal-committee" style="left: 120px; top: 700px; width: 900px;"><span>A SMALL TECHNOLOGY COMMITTEE IN YOUR KITCHEN</span></div>
      <img class="wit reveal-committee" data-layout-allow-overflow="" style="right: -340px; bottom: -360px; width: 1280px;" src="./assets/wit/wit-pose-confused.png" alt="">
    </div>

    <div id="cue-tiny-part" class="clip cue" data-layout-allow-overflow="" style="overflow: visible;" data-start="29.52" data-duration="5.184" data-track-index="2">
      <div class="label red" style="left: 130px; top: 110px; width: 620px;"><span>ONE TINY PART FAILS</span></div>
      <div class="payoff reveal-fix"><span>HARDER + MORE EXPENSIVE TO FIX</span></div>
      <img class="wit reveal-fix" data-layout-allow-overflow="" style="right: -340px; bottom: -400px; width: 1320px;" src="./assets/wit/wit-pose-money-panic.png" alt="">
    </div>


    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // good-features list (whisper: safer 6.22, better battery 7.46, phone 8.86)
      tl.set(".reveal-battery", { opacity: 0 }, 3.04); tl.set(".reveal-battery", { opacity: 1 }, 7.46);
      tl.set(".reveal-phone",   { opacity: 0 }, 3.04); tl.set(".reveal-phone",   { opacity: 1 }, 8.86);
      // feature pile (screens 18.44 / sensors 19.26 / water 19.68 / ice 20.24 / software 21.44 / opinions 21.66)
      tl.set(".reveal-screens",  { opacity: 0 }, 15.04); tl.set(".reveal-screens",  { opacity: 1 }, 18.44);
      tl.set(".reveal-sensors",  { opacity: 0 }, 15.04); tl.set(".reveal-sensors",  { opacity: 1 }, 19.26);
      tl.set(".reveal-water",    { opacity: 0 }, 15.04); tl.set(".reveal-water",    { opacity: 1 }, 19.68);
      tl.set(".reveal-ice",      { opacity: 0 }, 15.04); tl.set(".reveal-ice",      { opacity: 1 }, 20.24);
      tl.set(".reveal-software", { opacity: 0 }, 15.04); tl.set(".reveal-software", { opacity: 1 }, 21.44);
      tl.set(".reveal-opinions", { opacity: 0 }, 15.04); tl.set(".reveal-opinions", { opacity: 1 }, 21.66);
      // committee reveal + confused WIT ("technology committee" 26.82)
      tl.set(".reveal-committee", { opacity: 0 }, 15.04); tl.set(".reveal-committee", { opacity: 1 }, 26.82);
      // payoff ("more expensive to fix" 33.22)
      tl.set(".reveal-fix", { opacity: 0 }, 29.52); tl.set(".reveal-fix", { opacity: 1 }, 33.22);
      window.__timelines["Section05MoreFeaturesMoreTinyDeaths"] = tl;
    </script>
  </div>
</body>
</html>
