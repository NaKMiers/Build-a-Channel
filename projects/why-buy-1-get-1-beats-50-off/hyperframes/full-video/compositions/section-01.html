<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Section 01 Hook - Why Buy 1 Get 1 Free Beats 50% Off</title>
  <style>
    @font-face { font-family: "PatrickHandLocal"; src: url("./assets/fonts/patrick-hand-latin.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: block; }
    :root { --ink:#14110d; --red:#e0392b; --red-deep:#7d1714; --cream:#fff7d8; --green:#1db954; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #07070a; color:#fff; overflow: hidden; }
    #Section01Hook { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #07070a; font-family: "PatrickHandLocal"; }
    .scene, .cue { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; }
    .scene { z-index: 1; will-change: opacity, transform, filter; }
    .cue { z-index: 5; pointer-events: none; }
    .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .photo.cart   { filter:saturate(1.07) contrast(1.05) brightness(0.82); }
    .photo.cash   { filter:saturate(1.1) contrast(1.05) brightness(0.66); }
    .photo.curtain{ filter:saturate(1.05) contrast(1.06) brightness(0.7); }
    .scrim { position:absolute; inset:0; z-index:1; background:radial-gradient(ellipse 82% 82% at 42% 46%, rgba(4,5,10,0.18), rgba(4,5,10,0.72) 99%); }
    .ui { font-family:"Segoe UI",system-ui,sans-serif; }

    /* handwritten aside label */
    .hand { position:absolute; z-index:7; font-family:"PatrickHandLocal"; font-size:60px; color:#fff; text-shadow:3px 4px 0 rgba(0,0,0,0.55); }

    /* price signs */
    .tag { position:absolute; z-index:7; border-radius:18px; padding:18px 30px; text-align:center; box-shadow:0 16px 34px rgba(0,0,0,0.5); font-family:"Segoe UI",system-ui,sans-serif; }
    .tag .top { font-weight:900; line-height:0.96; }
    .tag .sub { font-weight:700; margin-top:8px; opacity:0.95; }
    .tag.half { background:#f4f1e8; color:#1b1b1b; border:4px solid #b9b2a0; }
    .tag.half .top { font-size:72px; } .tag.half .sub { font-size:34px; color:#444; }
    .tag.free { background:var(--red); color:#fff; border:6px solid #fff; transform:rotate(-5deg); box-shadow:0 20px 44px rgba(224,57,43,0.5); }
    .tag.free .top { font-size:122px; letter-spacing:1px; } .tag.free .sub { font-size:40px; }

    /* "same to you" strip */
    .strip { position:absolute; z-index:7; background:rgba(12,12,18,0.82); border:3px solid #fff; border-radius:16px; padding:16px 34px; font-family:"Segoe UI",system-ui,sans-serif; font-weight:800; font-size:46px; color:#fff; text-align:center; box-shadow:0 14px 30px rgba(0,0,0,0.5); }
    .strip b { color:#ffd23f; }

    /* profit meter */
    .meter { position:absolute; z-index:7; display:flex; align-items:flex-end; gap:56px; }
    .col { display:flex; flex-direction:column; align-items:center; font-family:"Segoe UI",system-ui,sans-serif; }
    .bar { width:150px; border-radius:14px 14px 0 0; box-shadow:0 -6px 24px rgba(0,0,0,0.4) inset, 0 12px 26px rgba(0,0,0,0.45); }
    .bar.b1 { height:120px; background:linear-gradient(180deg,#7f8a93,#5a636b); }
    .bar.b2 { height:240px; background:linear-gradient(180deg,#ff5a4d,#c4231a); }
    .col .amt { font-weight:900; font-size:62px; color:#fff; margin-bottom:10px; text-shadow:3px 4px 0 rgba(0,0,0,0.4); }
    .col .cap { font-weight:800; font-size:30px; color:#e9e4d6; margin-top:14px; }
    .col .cap.freecap { color:#ff8a7d; }
    .x2 { position:absolute; z-index:9; font-family:"Segoe UI",system-ui,sans-serif; font-weight:900; font-size:120px; color:#ffd23f; text-shadow:0 0 28px rgba(0,0,0,0.6), 5px 6px 0 rgba(0,0,0,0.45); transform:rotate(-8deg); }
    .ring { position:absolute; z-index:10; border:10px solid var(--red); border-radius:50%; box-shadow:0 0 22px rgba(224,57,43,0.6); }

    /* magic scene */
    .hat { position:absolute; z-index:6; bottom:-10px; left:50%; transform:translateX(-50%); width:470px; filter:drop-shadow(0 18px 30px rgba(0,0,0,0.6)); }
    .head { position:absolute; z-index:9; font-family:"Segoe UI",system-ui,sans-serif; font-weight:900; line-height:0.96; text-shadow:0 0 40px rgba(0,0,0,0.7), 6px 7px 0 rgba(0,0,0,0.5); }
    .head .strike { color:#cfd3dc; } .head .red { color:#ff5a4d; }
    .payoff { position:absolute; z-index:12; font-family:"Segoe UI",system-ui,sans-serif; font-weight:900; font-size:118px; line-height:0.92; color:#fff; text-shadow:0 0 46px rgba(0,0,0,0.75), 8px 9px 0 rgba(0,0,0,0.5); letter-spacing:-1px; }
    .payoff .hl { color:#ffd23f; }

    .wit { position:absolute; object-fit:contain; z-index:8; filter:drop-shadow(15px 18px 0 rgba(0,0,0,0.32)); transform-origin:center center; }

    /* WIT-becomes-the-rabbit: wrapper + bunny ears (Scene C payoff) */
    .witwrap { position:absolute; z-index:8; }
    .witwrap .wit { position:absolute; left:0; top:0; width:100%; height:auto; }
    .ears { position:absolute; left:0; top:0; width:100%; height:100%; z-index:9; pointer-events:none; transform-origin:50% 88%; }
    .ear { position:absolute; top:-10%; width:10%; height:24%; background:#fff; border:8px solid var(--ink); border-radius:48% 48% 46% 46% / 62% 62% 38% 38%; box-shadow:6px 8px 0 rgba(0,0,0,0.18); }
    .ear::after { content:""; position:absolute; left:50%; top:16%; transform:translateX(-50%); width:44%; height:62%; background:#f3a6c2; border-radius:50%; }
    .ear.left  { left:35%; transform:rotate(-19deg); transform-origin:50% 100%; }
    .ear.right { left:55%; transform:rotate(19deg);  transform-origin:50% 100%; }

    .tag,.strip,.meter,.x2,.ring,.hand,.head,.payoff,.wit,.hat,.ears { will-change: opacity, transform; }
  </style>
</head>
<body>
  <div id="Section01Hook" data-composition-id="Section01Hook" data-start="0" data-duration="23.019" data-width="1920" data-height="1080">

    <!-- SCENE A: shopping cart / store 0-7.60 -->
    <div id="scene-a" class="clip scene" data-start="0" data-duration="7.60" data-track-index="1">
      <img class="photo cart" src="./assets/visual-references/section-01-hook/base-a-store-greengrocer.jpg" alt="">
      <div class="scrim"></div>
    </div>

    <!-- SCENE B: cash / profit 7.60-18.94 -->
    <div id="scene-b" class="clip scene" data-start="7.60" data-duration="11.34" data-track-index="3">
      <img class="photo cash" src="./assets/visual-references/section-01-hook/base-b-profit-coins.jpg" alt="">
      <div class="scrim"></div>
    </div>

    <!-- SCENE C: red curtain + magic hat 18.94-23.019 -->
    <div id="scene-c" class="clip scene" data-start="18.94" data-duration="4.079" data-track-index="4">
      <img class="photo curtain" src="./assets/visual-references/section-01-hook/base-c-red-curtain.jpg" alt="">
      <div class="scrim"></div>
      <img class="hat" src="./assets/visual-references/section-01-hook/base-c-magic-hat.jpg" alt="">
    </div>

    <!-- CUE A 0-7.58 -->
    <div id="cue-a" class="clip cue" data-start="0" data-duration="7.58" data-track-index="2" data-layout-allow-overflow="" style="overflow: visible;">
      <div class="hand ca-label" style="left:130px; top:104px; width:760px;">Sounds impossible…</div>
      <div class="tag free ca-free" style="left:150px; top:300px;"><div class="top">FREE!</div><div class="sub">$5 / item</div></div>
      <div class="tag half ca-half" style="left:215px; top:640px;"><div class="top">50% OFF</div><div class="sub">$5 / item</div></div>
      <img class="wit ca-wit" data-layout-allow-overflow="" style="right:-120px; bottom:-360px; width:1190px;" src="./assets/wit/wit-pose-price-tag-suspicion.png" alt="">
    </div>

    <!-- CUE B 7.60-18.92 -->
    <div id="cue-b" class="clip cue" data-start="7.60" data-duration="11.32" data-track-index="2" data-layout-allow-overflow="" style="overflow: visible;">
      <div class="strip cb-strip ui" style="left:430px; top:104px; width:1060px;">Same product · same shelf · <b>$5 each</b></div>
      <div class="meter cb-meter" style="left:1160px; top:330px;">
        <div class="col"><div class="amt">+$1</div><div class="bar b1"></div><div class="cap">50% OFF</div></div>
        <div class="col"><div class="amt" style="color: white;">+$2</div><div class="bar b2 cb-freebar"></div><div class="cap freecap">FREE</div></div>
      </div>
      <div class="x2 cb-x2" style="left:1560px; top:250px;">×2</div>
      <div class="ring cb-ring" style="border-color: skyblue; left:1330px; top:300px; width:230px; height:300px;"></div>
      <img class="wit cb-wit" data-layout-allow-overflow="" style="left:-200px; bottom:-360px; width:1360px;" src="./assets/wit/wit-pose-hidden-fee-panic.png" alt="">
    </div>

    <!-- CUE C 18.94-23.019 -->
    <div id="cue-c" class="clip cue" data-start="18.94" data-duration="4.079" data-track-index="2" data-layout-allow-overflow="" style="overflow: visible;">
      <div class="head cc-head1" style="left:110px; top:100px; font-size:70px; color:#cfd3dc;">not generosity.</div>
      <div class="head cc-head2" style="left:110px; top:188px; font-size:86px; color:#ff5a4d;">A MAGIC TRICK.</div>
      <div class="payoff cc-payoff" style="left:110px; top:300px; font-size:120px;">YOU ARE<br>THE <span class="hl">RABBIT</span></div>
      <div class="witwrap cc-witwrap" data-layout-allow-overflow="" style="left:560px; bottom:-360px; width:1180px; height:1180px;">
        <img class="wit cc-wit" src="./assets/wit/wit-pose-betrayed.png" alt="">
        <div class="ears cc-ears">
          <div class="ear left"></div>
          <div class="ear right"></div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true, defaults: { overwrite: "auto" } });
      const reveal = (t, hideAt, at, fv, tv = {}) => { const r = {}; if ("x" in fv) r.x = 0; if ("y" in fv) r.y = 0; if ("scale" in fv) r.scale = 1; if ("opacity" in fv) r.opacity = 1; tl.set(t, fv, hideAt); tl.to(t, { ...r, ...tv }, at); };
      const show = (t, hideAt, at) => { tl.set(t, { opacity: 0 }, hideAt); tl.set(t, { opacity: 1 }, at); };
      const hide = (t, at) => { tl.set(t, { opacity: 0 }, at); };
      const smash = (t, hideAt, at, fv = { y: 20, scale: 1.3, opacity: 0 }) => reveal(t, hideAt, at, fv, { duration: 0.18, ease: "back.out(1.9)" });
      const pop = (t, hideAt, at) => reveal(t, hideAt, at, { scale: 0.4, opacity: 0 }, { duration: 0.22, ease: "back.out(2)" });

      // scene cross-fades (pinned to word timings)
      tl.fromTo("#scene-b", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "sine.out", immediateRender: false }, 7.60);
      tl.fromTo("#scene-c", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "sine.out", immediateRender: false }, 18.94);

      // SCENE A - impossible claim + two signs
      show("#cue-a .ca-label", 0, 0.30);                         // "Here is something..."
      show("#cue-a .ca-wit", 0, 2.00);                           // WIT suspicious on "impossible"
      smash("#cue-a .ca-free", 0, 3.88, { scale: 0.5, opacity: 0 }); // "free" @3.88
      show("#cue-a .ca-half", 0, 6.70);                          // "half price" @6.70

      // SCENE B - same $5, but FREE doubles profit
      show("#cue-b .cb-strip", 7.60, 7.72);                      // "Same product..." @7.72
      hide("#cue-b .cb-meter", 7.60); hide("#cue-b .cb-x2", 7.60); hide("#cue-b .cb-ring", 7.60); hide("#cue-b .cb-wit", 7.60);
      show("#cue-b .cb-meter", 7.60, 12.36);                     // "doubles" @12.36
      tl.set("#cue-b .cb-freebar", { scaleY: 0.5, transformOrigin: "bottom" }, 12.36);
      tl.to("#cue-b .cb-freebar", { scaleY: 1, duration: 0.45, ease: "power3.out" }, 12.50);
      smash("#cue-b .cb-x2", 7.60, 13.00, { scale: 0.4, opacity: 0 }); // emphasis on "profit"
      show("#cue-b .cb-wit", 7.60, 13.94);                       // WIT panic on "surprise" @13.94
      smash("#cue-b .cb-ring", 7.60, 14.98, { scale: 1.6, opacity: 0 }); // "free one" @14.98

      // SCENE C - magic trick + rabbit payoff
      show("#cue-c .cc-head1", 18.94, 19.22);                    // "not generosity" @19.22
      smash("#cue-c .cc-head2", 18.94, 20.78, { y: 16, scale: 1.2, opacity: 0 }); // "magic trick" @20.78
      hide("#cue-c .cc-payoff", 18.94);
      show("#cue-c .cc-wit", 18.94, 21.60);                      // WIT betrayed rises after "trick"
      smash("#cue-c .cc-payoff", 18.94, 22.48, { y: 28, scale: 1.25, opacity: 0 }); // "rabbit" @22.48
      pop("#cue-c .cc-ears", 18.94, 22.48);                      // WIT sprouts bunny ears on "rabbit" - you ARE the rabbit

      window.__timelines["Section01Hook"] = tl;
    </script>
  </div>
</body>
</html>
