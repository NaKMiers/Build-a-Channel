<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Short 03 — Your Free Trial Of A Warm Bottom</title>
<style>
  @font-face{ font-family:'Patrick Hand'; src:url('assets/fonts/patrick-hand-latin.woff2') format('woff2'); font-display:swap; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:#07070a; overflow:hidden; }
  #Short03{ position:relative; width:1080px; height:1920px; overflow:hidden; background:#07070a;
            font-family:'Patrick Hand', system-ui, sans-serif; }

  .scene{ position:absolute; inset:0; }
  .photo{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center; }
  .scrim-top{ position:absolute; top:0; left:0; right:0; height:720px;
              background:linear-gradient(180deg, rgba(0,0,0,0.66), rgba(0,0,0,0)); }
  .scrim-bottom{ position:absolute; bottom:0; left:0; right:0; height:600px;
                 background:linear-gradient(0deg, rgba(0,0,0,0.58), rgba(0,0,0,0)); }

  .wit{ position:absolute; left:50%; bottom:360px; transform:translateX(-50%);
        width:940px; transform-origin:center bottom; opacity:0;
        filter:drop-shadow(0 14px 30px rgba(0,0,0,0.55)); }
  #witShocked{ bottom:420px; }
  #witDeadpan{ bottom:430px; }
  .wit-layer{ position:absolute; inset:0; pointer-events:none; }

  .card-layer{ position:absolute; inset:0; }
  /* streaming wall */
  .streamwall{ position:absolute; left:50%; top:235px; transform:translateX(-50%); width:740px; opacity:0; }
  .srow{ height:80px; margin-bottom:14px; border-radius:14px; border:4px solid rgba(255,255,255,0.92);
         display:flex; align-items:center; padding:0 30px; color:#fff; font-size:46px; letter-spacing:1px;
         box-shadow:0 8px 18px rgba(0,0,0,0.45); }
  .srow.s1{ background:#c0392b; } .srow.s2{ background:#2d6cdf; } .srow.s3{ background:#1d7a3a; }
  .srow.s4{ background:#8e44ad; } .srow.s5{ background:#d68910; }
  /* POV stamp */
  .pov{ position:absolute; left:50%; top:330px; transform:translateX(-50%) rotate(-3deg);
        color:#fff; background:#111; font-size:88px; letter-spacing:2px; line-height:1.02;
        padding:18px 44px; border-radius:16px; border:6px solid #fff; white-space:nowrap; text-align:center;
        box-shadow:0 16px 36px rgba(0,0,0,0.6); opacity:0; }
  .pov small{ display:block; font-size:44px; color:#ffd23f; letter-spacing:3px; }
  /* heated-seat paywall card */
  .paywall{ position:absolute; left:50%; top:270px; transform:translateX(-50%) rotate(-1.5deg);
            background:#fdf6e3; color:#241c12; font-size:64px; line-height:1.12; text-align:center;
            padding:24px 44px; border-radius:18px; border:6px solid #241c12; white-space:nowrap;
            box-shadow:0 14px 30px rgba(0,0,0,0.5); opacity:0; }
  .paywall .seat{ font-size:72px; }
  .paywall .lock{ display:block; width:max-content; margin:16px auto 0; color:#fff; background:#c0392b;
                  font-size:54px; letter-spacing:1px; padding:8px 26px; border-radius:12px; border:4px solid #fff; }
  /* warm-bottom payoff */
  .expired{ position:absolute; left:50%; top:280px; transform:translateX(-50%) rotate(-3deg);
            color:#fff; background:#c0392b; font-size:62px; line-height:1.08; letter-spacing:1px;
            padding:24px 42px; border-radius:18px; border:7px solid #fff; white-space:nowrap; text-align:center;
            box-shadow:0 18px 40px rgba(0,0,0,0.55); opacity:0; }
  .expired small{ display:block; font-size:46px; color:#ffd9d2; letter-spacing:2px; }
  .expired .big{ display:block; margin:8px 0; font-size:82px; }

  .caption-layer{ position:absolute; inset:0; }
  .cap{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
        background:rgba(16,12,9,0.5); border-radius:22px; padding:14px 32px;
        color:#fff; font-size:62px; line-height:1.1; text-align:center; white-space:nowrap;
        max-width:800px; text-shadow:0 2px 0 #000, 0 0 16px rgba(0,0,0,0.85);
        -webkit-text-stroke:1px rgba(0,0,0,0.55); opacity:0; }
</style>
</head>
<body>
<div id="Short03" data-composition-id="Short03" data-start="0" data-duration="21.05" data-width="1080" data-height="1920">

  <!-- Scene bases -->
  <div class="clip scene" id="sceneA" data-composition-id="s03-sceneA" data-start="0"    data-duration="10.30" data-track-index="1">
    <img class="photo" src="assets/photos/tv-room.jpg" alt=""><div class="scrim-top"></div><div class="scrim-bottom"></div>
  </div>
  <div class="clip scene" id="sceneB" data-composition-id="s03-sceneB" data-start="9.85" data-duration="11.20" data-track-index="3">
    <img class="photo" src="assets/photos/car.jpg" alt=""><div class="scrim-top"></div><div class="scrim-bottom"></div>
  </div>

  <!-- WIT layer -->
  <div class="wit-layer">
    <img class="wit" id="witShocked" src="assets/wit/wit-pose-shocked.png" alt="">
    <img class="wit" id="witDeadpan" src="assets/wit/wit-pose-deadpan-side-eye.png" alt="">
  </div>

  <!-- Hero cards -->
  <div class="card-layer">
    <div class="streamwall" id="wall">
      <div class="srow s1">Shows</div>
      <div class="srow s2">Movies</div>
      <div class="srow s3">Music</div>
      <div class="srow s4">More shows</div>
      <div class="srow s5">Even more shows</div>
    </div>
    <div class="pov" id="lblPov"><small>POV:</small>YOU OWN NOTHING</div>
    <div class="paywall" id="lblPaywall">the heated seats<br><span class="seat">already in YOUR car</span><span class="lock">now: a monthly fee</span></div>
    <div class="expired" id="lblExpired"><small>YOUR FREE TRIAL OF</small><span class="big">A WARM BOTTOM</span><small>has expired</small></div>
  </div>

  <!-- Captions -->
  <div class="caption-layer">
    <div class="cap" id="cap1">you don't own a single one</div>
    <div class="cap" id="cap2">stop paying — it all vanishes</div>
    <div class="cap" id="cap3">wait… my own car?</div>
  </div>

  <audio id="vo" data-start="0" data-duration="19.648" data-track-index="10" data-volume="1" crossorigin="anonymous" src="assets/../voiceover/short-03.mp3"></audio>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true, defaults:{ overwrite:"auto" } });
    window.__timelines["Short03"] = tl;

    gsap.set(['#sceneB'], { opacity:0 });
    gsap.set(['#witShocked','#witDeadpan'], { opacity:0 });
    gsap.set(['.streamwall','.pov','.paywall','.expired','.cap'], { opacity:0 });

    const show = (sel,t)=> tl.set(sel,{opacity:1}, t);
    const hide = (sel,t)=> tl.set(sel,{opacity:0}, t);
    const pop  = (sel,t)=> tl.fromTo(sel,{opacity:0,scale:0.6},
                    {opacity:1,scale:1,duration:0.42,ease:'back.out(2)',immediateRender:false}, t);
    const poof = (sel,t)=> tl.to(sel,{opacity:0,scale:1.25,filter:'blur(12px)',duration:0.45,ease:'power2.in'}, t);
    const fadeScene = (sel,t)=> tl.fromTo(sel,{opacity:0,filter:'blur(14px)'},
                    {opacity:1,filter:'blur(0px)',duration:0.5,immediateRender:false}, t);

    // ---- Scene A (tv-room) : you rent a library that can vanish ----
    show('#witShocked', 0.0);
    show('#cap1', 0.05); hide('#cap1', 2.20);
    pop('#wall', 4.62);                          // "you rent a giant library"
    pop('#cap2', 5.98); hide('#cap2', 7.40);
    poof('#wall', 7.62);                         // "the whole thing vanishes"
    pop('#lblPov', 9.14);                        // "POV: you own nothing"

    // ---- Scene B (car) : heated seats behind a monthly fee -> the payoff ----
    fadeScene('#sceneB', 9.85);
    hide('#witShocked', 9.85); hide('#lblPov', 9.85);
    show('#witDeadpan', 10.00);
    pop('#lblPaywall', 12.80);                   // "heated seats ... behind a monthly fee"
    pop('#cap3', 13.56); hide('#cap3', 15.10);
    hide('#lblPaywall', 17.05);
    pop('#lblExpired', 17.24);                   // payoff card, holds to end
  </script>
</div>
</body>
</html>
