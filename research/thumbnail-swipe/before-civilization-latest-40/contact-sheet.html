<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Before Civilization - latest 40 thumbnails</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #111; color: #eee; font: 16px/1.3 Arial, sans-serif; }
    .sheet { width: 1360px; padding: 32px; display: grid; grid-template-columns: repeat(2, 640px); gap: 24px 16px; background: #111; }
    figure { margin: 0; }
    img { display: block; width: 640px; height: 360px; object-fit: cover; }
    figcaption { min-height: 26px; padding-top: 6px; color: #ddd; }
  </style>
</head>
<body>
  <main id="sheets"></main>
  <script>
    const ids = [
      "p0OuWdIEUv4", "h2MjNEw0YxM", "ni9dfloMvek", "MDa6ZFH9XIo", "xxHvuA7i7K8",
      "k4ZKvJd_ZJw", "iYub7rFKhE8", "yssC3OO1fPE", "jmtwXEI2KtY", "KsiU8bLFrkk",
      "Y2f5hmzS-bs", "lDzNtUcAGa0", "ZgjaWjHbUDw", "mBhEbiA375U", "BZA-s-ALxmI",
      "xFyBOzXXD08", "AGgVn9InFdA", "YKq-IjmQSh8", "C0oXQgdbyOg", "RDgdwV6fXvg",
      "gKGDKDNtz8Y", "GLwwy67xVHE", "mnMUWv6w-1w", "PkDWrydX9Gg", "RlhWT97Cl9w",
      "LawvvlYT9T8", "WKA5KFS1GNU", "cr6lhGksat4", "o7OysKlxfGQ", "AMlOV55o6mQ",
      "qFePAcuMnvE", "daPwO72k2u4", "zTxhD2iCTP0", "uPkmNl_I3aw", "btbL0gnLOu4",
      "UmMhk2nmdus", "v562ZDFRjkE", "Poco59Ojnmc", "2xiAreVNkpI", "Mn-wRBUe2W4"
    ];
    const root = document.getElementById("sheets");
    for (let group = 0; group < 4; group += 1) {
      const section = document.createElement("section");
      section.className = "sheet";
      section.id = `sheet-${group + 1}`;
      ids.slice(group * 10, group * 10 + 10).forEach((id, offset) => {
        const rank = group * 10 + offset + 1;
        const rankText = String(rank).padStart(2, "0");
        const figure = document.createElement("figure");
        figure.innerHTML = `<img src="${rankText}_${id}.jpg" alt="Thumbnail ${rankText}"><figcaption>${rankText} | ${id}</figcaption>`;
        section.appendChild(figure);
      });
      root.appendChild(section);
    }
  </script>
</body>
</html>
